<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MariBank RP</title>

<script src="rp-data.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101820;
  font-family:Arial,sans-serif;
  color:#18202a;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#f6f7f8;
  padding-bottom:82px;
}

/* HEADER */

.hero{
  background:linear-gradient(145deg,#ff7a00,#e85200);
  color:white;
  padding:18px 18px 28px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.menu{
  font-size:24px;
}

.welcome{
  margin-top:24px;
  font-size:13px;
  opacity:.85;
}

.balance{
  font-size:36px;
  font-weight:800;
  margin:5px 0 20px;
}

.account{
  background:#ffffff1b;
  padding:12px 14px;
  border-radius:15px;
  font-size:12px;
}

/* QUICK ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:15px;
}

.action{
  border:0;
  background:#fff;
  border-radius:17px;
  padding:13px 4px;
  font-size:10px;
  box-shadow:0 2px 8px #0000000d;
  cursor:pointer;
}

.action span{
  display:block;
  font-size:22px;
  margin-bottom:6px;
}

/* BODY */

.body{
  padding:16px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px 10px;
}

.section h3{
  margin:0;
  font-size:17px;
}

.see{
  color:#ed6200;
  font-size:12px;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:#fff;
  border-radius:19px;
  padding:16px;
  box-shadow:0 2px 10px #0000000c;
}

.card-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#fff0e7;
  display:grid;
  place-items:center;
  font-size:21px;
  margin-bottom:13px;
}

.card-title{
  font-size:12px;
  color:#737b85;
}

.card-value{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
}

/* TRANSACTIONS */

.transaction-card{
  background:#fff;
  border-radius:20px;
  padding:15px;
  box-shadow:0 2px 10px #0000000c;
}

.tx{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 0;
  border-bottom:1px solid #edf0f2;
}

.tx:last-child{
  border-bottom:0;
}

.txicon{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#fff0e7;
  display:grid;
  place-items:center;
  font-size:20px;
}

.txmain{
  flex:1;
}

.txmain b{
  font-size:13px;
}

.muted{
  color:#858d98;
  font-size:11px;
  margin-top:4px;
}

.amount{
  font-size:13px;
  font-weight:800;
}

.out{
  color:#df4747;
}

.in{
  color:#129568;
}

/* BOTTOM */

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:72px;
  background:white;
  border-top:1px solid #e5e8ec;
  display:flex;
  z-index:10;
}

.nav button{
  flex:1;
  border:0;
  background:none;
  color:#818894;
  font-size:10px;
}

.nav button.active{
  color:#e85b00;
  font-weight:700;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

/* MODAL */

.sheet{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:20;
}

.modal{
  width:min(480px,100%);
  margin:auto;
  background:white;
  border-radius:26px 26px 0 0;
  padding:20px;
  max-height:85vh;
  overflow:auto;
}

.close{
  float:right;
  width:33px;
  height:33px;
  border:0;
  border-radius:50%;
  background:#f0f2f4;
  font-size:18px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <section class="hero">

    <div class="top">

      <div class="logo">
        MariBank
      </div>

      <div class="menu">
        ⋯
      </div>

    </div>

    <div class="welcome">
      Good day, RP user
    </div>

    <div class="balance" id="balance">
      ₱0.00
    </div>

    <div class="account">
      Savings Account
      <br>
      <span>RP ACCOUNT •••• 4821</span>
    </div>

  </section>


  <!-- QUICK ACTIONS -->

  <div class="body">

    <div class="actions">

      <button class="action"
              onclick="demo('Transfer Money')">

        <span>↗</span>
        Transfer

      </button>

      <button class="action"
              onclick="demo('Receive Money')">

        <span>↓</span>
        Receive

      </button>

      <button class="action"
              onclick="demo('Pay Bills')">

        <span>🧾</span>
        Bills

      </button>

      <button class="action"
              onclick="showHistory()">

        <span>↺</span>
        History

      </button>

    </div>


    <!-- MONEY OVERVIEW -->

    <div class="section"
         style="margin-top:25px">

      <h3>
        My money
      </h3>

      <span class="see">
        Overview
      </span>

    </div>


    <div class="cards">

      <div class="card">

        <div class="card-icon">
          💰
        </div>

        <div class="card-title">
          Available
        </div>

        <div class="card-value"
             id="available">

          ₱0.00

        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          📊
        </div>

        <div class="card-title">
          Transactions
        </div>

        <div class="card-value"
             id="txCount">

          0

        </div>

      </div>

    </div>


    <!-- RECENT -->

    <div class="section"
         style="margin-top:25px">

      <h3>
        Recent activity
      </h3>

      <span class="see"
            onclick="showHistory()">

        See all

      </span>

    </div>


    <div class="transaction-card"
         id="transactions">

      Loading...

    </div>

  </div>


  <!-- NAV -->

  <div class="nav">

    <button class="active"
            onclick="location.reload()">

      <span>⌂</span>
      Home

    </button>

    <button onclick="demo('Transfer')">

      <span>↗</span>
      Transfer

    </button>

    <button onclick="showHistory()">

      <span>↺</span>
      History

    </button>

    <button onclick="location.href='index.html'">

      <span>▣</span>
      Apps

    </button>

  </div>

</div>


<!-- MODAL -->

<div class="sheet"
     id="sheet">

  <div class="modal">

    <button class="close"
            onclick="closeSheet()">

      ×

    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

function peso(amount){

  return new Intl.NumberFormat(
    "en-PH",
    {
      style:"currency",
      currency:"PHP"
    }
  ).format(amount);

}


function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[char];

      }
    );

}


function render(){

  const data = loadRP();

  const balance =
    Number(data.maribank.balance);


  document.getElementById(
    "balance"
  ).textContent =
    peso(balance);


  document.getElementById(
    "available"
  ).textContent =
    peso(balance);


  document.getElementById(
    "txCount"
  ).textContent =
    data.maribank.transactions.length;


  const box =
    document.getElementById(
      "transactions"
    );


  if(
    !data.maribank.transactions.length
  ){

    box.innerHTML = `

      <div class="muted"
           style="padding:10px">

        No transactions yet.

        <br>

        Your RP banking activity
        will appear here.

      </div>

    `;

    return;

  }


  box.innerHTML =
    data.maribank.transactions
    .slice(0,8)
    .map(function(tx){

      const amount =
        Number(tx.amount);


      return `

        <div class="tx">

          <div class="txicon">

            ${tx.icon || "💳"}

          </div>


          <div class="txmain">

            <b>
              ${esc(
                tx.name ||
                "Transaction"
              )}
            </b>

            <div class="muted">

              ${esc(
                tx.description ||
                "RP transaction"
              )}

              <br>

              ${esc(
                tx.date || ""
              )}

            </div>

          </div>


          <div class="amount ${
            amount < 0
              ? "out"
              : "in"
          }">

            ${
              amount < 0
                ? "−"
                : "+"
            }

            ${peso(
              Math.abs(amount)
            )}

          </div>

        </div>

      `;

    })
    .join("");

}


function demo(name){

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <h2>
      ${name}
    </h2>

    <p style="color:#777">

      This is an RP feature.

      We'll connect this service
      to the shared banking system
      as we build the next apps.

    </p>

  `;


  document.getElementById(
    "sheet"
  ).style.display =
    "flex";

}


function showHistory(){

  const data = loadRP();

  let html =
    "<h2>MariBank history</h2>";


  if(
    !data.maribank.transactions.length
  ){

    html +=
      '<p class="muted">No transactions yet.</p>';

  }

  else{

    html +=
      data.maribank.transactions
      .map(function(tx){

        const amount =
          Number(tx.amount);


        return `

          <div class="tx">

            <div class="txicon">

              ${tx.icon || "💳"}

            </div>


            <div class="txmain">

              <b>
                ${esc(
                  tx.name ||
                  "Transaction"
                )}
              </b>

              <div class="muted">

                ${esc(
                  tx.description || ""
                )}

                <br>

                ${esc(
                  tx.date || ""
                )}

              </div>

            </div>


            <div class="amount ${
              amount < 0
                ? "out"
                : "in"
            }">

              ${
                amount < 0
                  ? "−"
                  : "+"
              }

              ${peso(
                Math.abs(amount)
              )}

            </div>

          </div>

        `;

      })
      .join("");

  }


  document.getElementById(
    "modalContent"
  ).innerHTML =
    html;


  document.getElementById(
    "sheet"
  ).style.display =
    "flex";

}


function closeSheet(){

  document.getElementById(
    "sheet"
  ).style.display =
    "none";

}


render();

</script>

</body>
</html>
