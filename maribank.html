<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MariBank RP</title>

<script src="rp-data.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  font-family:Arial,sans-serif;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#f6f7f9;
  padding-bottom:90px;
}

.hero{
  background:linear-gradient(145deg,#ff7800,#e94f00);
  color:white;
  padding:20px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.menu{
  font-size:24px;
}

.greeting{
  margin-top:24px;
  font-size:13px;
  opacity:.85;
}

.balance{
  font-size:38px;
  font-weight:800;
  margin:5px 0 20px;
}

.account{
  background:#ffffff20;
  padding:13px 15px;
  border-radius:15px;
  font-size:12px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:15px;
}

.action{
  border:0;
  background:white;
  border-radius:17px;
  padding:12px 3px;
  font-size:10px;
  box-shadow:0 2px 9px #0000000d;
  cursor:pointer;
}

.action span{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.body{
  padding:16px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 2px;
}

.section h3{
  margin:0;
  font-size:17px;
}

.link{
  color:#e95b00;
  font-size:12px;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:white;
  border-radius:19px;
  padding:16px;
  box-shadow:0 3px 12px #0000000b;
}

.icon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#fff0e7;
  display:grid;
  place-items:center;
  font-size:21px;
  margin-bottom:12px;
}

.label{
  color:#7c8490;
  font-size:11px;
}

.value{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
}

.transactions{
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 3px 12px #0000000b;
}

.tx{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 0;
  border-bottom:1px solid #edf0f2;
}

.tx:last-child{
  border-bottom:0;
}

.txicon{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#fff0e7;
  display:grid;
  place-items:center;
  font-size:20px;
}

.txmain{
  flex:1;
}

.txmain b{
  font-size:13px;
}

.muted{
  color:#818995;
  font-size:11px;
  margin-top:4px;
}

.amount{
  font-size:13px;
  font-weight:800;
}

.out{
  color:#df4747;
}

.in{
  color:#129568;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:72px;
  background:white;
  border-top:1px solid #e4e8ec;
  display:flex;
  z-index:5;
}

.nav button{
  flex:1;
  border:0;
  background:none;
  color:#7c8490;
  font-size:10px;
}

.nav .active{
  color:#e95b00;
  font-weight:bold;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.sheet{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:20;
}

.modal{
  width:min(480px,100%);
  margin:auto;
  background:white;
  border-radius:26px 26px 0 0;
  padding:22px;
  max-height:85vh;
  overflow:auto;
}

.close{
  float:right;
  width:33px;
  height:33px;
  border:0;
  border-radius:50%;
  background:#f0f2f4;
  font-size:18px;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid #dce1e7;
  border-radius:13px;
  font-size:16px;
  margin:7px 0;
}

.primary{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#ed5b00;
  color:white;
  font-weight:bold;
  margin-top:8px;
}

.secondary{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#eef1f4;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<section class="hero">

<div class="top">
<div class="logo">MariBank</div>
<div class="menu">•••</div>
</div>

<div class="greeting">
Good day, RP User
</div>

<div class="balance" id="balance">
₱0.00
</div>

<div class="account">
Savings Account
<br>
RP ACCOUNT •••• 4821
</div>

</section>


<div class="body">

<div class="actions">

<button class="action" onclick="cashIn()">
<span>＋</span>
Cash In
</button>

<button class="action" onclick="cashOut()">
<span>↘</span>
Cash Out
</button>

<button class="action" onclick="transfer()">
<span>↗</span>
Transfer
</button>

<button class="action" onclick="receiveUI()">
<span>↓</span>
Receive
</button>

</div>


<div class="section" style="margin-top:25px">
<h3>My Money</h3>
<span class="link">Overview</span>
</div>


<div class="cards">

<div class="card">
<div class="icon">💰</div>
<div class="label">Available Balance</div>
<div class="value" id="available">₱0.00</div>
</div>

<div class="card">
<div class="icon">📊</div>
<div class="label">Transactions</div>
<div class="value" id="count">0</div>
</div>

</div>


<div class="section" style="margin-top:25px">

<h3>Recent Activity</h3>

<span class="link"
onclick="historyUI()">
See all
</span>

</div>


<div class="transactions"
id="transactions">
Loading...
</div>

</div>


<div class="nav">

<button class="active"
onclick="location.reload()">
<span>⌂</span>
Home
</button>

<button onclick="transfer()">
<span>↗</span>
Transfer
</button>

<button onclick="historyUI()">
<span>↺</span>
History
</button>

<button onclick="location.href='index.html'">
<span>▣</span>
Apps
</button>

</div>

</div>


<div class="sheet" id="sheet">

<div class="modal">

<button class="close"
onclick="closeModal()">
×
</button>

<div id="modalContent"></div>

</div>

</div>


<script>

function peso(n){

return new Intl.NumberFormat(
"en-PH",
{
style:"currency",
currency:"PHP"
}
).format(Number(n));

}


function esc(s){

return String(s).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function openModal(html){

document.getElementById(
"modalContent"
).innerHTML=html;

document.getElementById(
"sheet"
).style.display="flex";

}


function closeModal(){

document.getElementById(
"sheet"
).style.display="none";

}


/* CASH IN */

function cashIn(){

openModal(`

<h2>💰 Cash In</h2>

<p class="muted">
Add money to your MariBank RP account.
</p>

<input
id="amount"
class="input"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="doCashIn()">
Add Money
</button>

<button
class="secondary"
onclick="closeModal()">
Cancel
</button>

`);

}


function doCashIn(){

const amount=
Number(
document.getElementById("amount").value
);

const result=
addMoney(
"maribank",
amount,
"Cash In"
);

if(!result.success){

alert(result.message);
return;

}

closeModal();
render();

}


/* CASH OUT */

function cashOut(){

openModal(`

<h2>💸 Cash Out</h2>

<p class="muted">
Remove money from your MariBank RP account.
</p>

<input
id="amount"
class="input"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="doCashOut()">
Cash Out
</button>

<button
class="secondary"
onclick="closeModal()">
Cancel
</button>

`);

}


function doCashOut(){

const amount=
Number(
document.getElementById("amount").value
);

const result=
removeMoney(
"maribank",
amount
);

if(!result.success){

alert(result.message);
return;

}

closeModal();
render();

}


/* TRANSFER */

function transfer(){

openModal(`

<h2>↗ Transfer Money</h2>

<input
id="recipient"
class="input"
placeholder="Recipient name">

<input
id="amount"
class="input"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="doTransfer()">
Transfer
</button>

<button
class="secondary"
onclick="closeModal()">
Cancel
</button>

`);

}


function doTransfer(){

const recipient=
document.getElementById(
"recipient"
).value.trim();

const amount=
Number(
document.getElementById("amount").value
);

if(!recipient){

alert("Enter recipient name.");
return;

}

const result=
payRP(
"maribank",
amount,
{
name:"Bank Transfer",
description:"To "+recipient,
icon:"↗"
}
);

if(!result.success){

alert(result.message);
return;

}

closeModal();
render();

}


/* RECEIVE */

function receiveUI(){

openModal(`

<h2>↓ Receive Money</h2>

<input
id="sender"
class="input"
placeholder="Sender name">

<input
id="amount"
class="input"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="doReceive()">
Receive
</button>

<button
class="secondary"
onclick="closeModal()">
Cancel
</button>

`);

}


function doReceive(){

const sender=
document.getElementById(
"sender"
).value.trim();

const amount=
Number(
document.getElementById("amount").value
);

if(!sender){

alert("Enter sender name.");
return;

}

const result=
receiveMoney(
"maribank",
amount,
"Received from "+sender
);

if(!result.success){

alert(result.message);
return;

}

closeModal();
render();

}


/* HISTORY */

function historyUI(){

const data=loadRP();

let html=
"<h2>📜 MariBank History</h2>";

if(!data.maribank.transactions.length){

html+=`
<p class="muted">
No transactions yet.
</p>
`;

}else{

html+=
data.maribank.transactions
.map(tx=>`

<div class="tx">

<div class="txicon">
${tx.icon||"💳"}
</div>

<div class="txmain">

<b>
${esc(tx.name)}
</b>

<div class="muted">
${esc(tx.description||"")}
<br>
${esc(tx.date||"")}
</div>

</div>

<div class="amount ${
Number(tx.amount)<0
?"out":"in"
}">

${
Number(tx.amount)<0
?"−":"+"
}

${peso(Math.abs(tx.amount))}

</div>

</div>

`).join("");

}

openModal(html);

}


/* RENDER */

function render(){

const data=loadRP();

const balance=
Number(data.maribank.balance);

document.getElementById(
"balance"
).textContent=
peso(balance);

document.getElementById(
"available"
).textContent=
peso(balance);

document.getElementById(
"count"
).textContent=
data.maribank.transactions.length;


const box=
document.getElementById(
"transactions"
);


if(!data.maribank.transactions.length){

box.innerHTML=`
<p class="muted">
No transactions yet.
</p>
`;

return;

}


box.innerHTML=
data.maribank.transactions
.slice(0,8)
.map(tx=>`

<div class="tx">

<div class="txicon">
${tx.icon||"💳"}
</div>

<div class="txmain">

<b>
${esc(tx.name)}
</b>

<div class="muted">
${esc(tx.description||"")}
<br>
${esc(tx.date||"")}
</div>

</div>

<div class="amount ${
Number(tx.amount)<0
?"out":"in"
}">

${
Number(tx.amount)<0
?"−":"+"
}

${peso(Math.abs(tx.amount))}

</div>

</div>

`).join("");

}

render();

</script>

</body>
  </html>
