<script>

const restaurants=[

{
name:"Burger House",
emoji:"🍔",
category:"Burgers",
rating:4.8,
time:"20–30 min",
delivery:39,
items:[
["Classic Cheeseburger","Juicy beef patty, cheese and sauce",159,"🍔"],
["Double Burger","Two beef patties with cheese",229,"🍔"],

]
},

items:[

["Hawaiian Pizza","Ham, pineapple and cheese",389,"🍕"],

]
},

{

emoji:"🍗",
category:"Chicken",
rating:4.9,
time:"20–30 min",
delivery:35,
items:[
["2pc Fried Chicken","Crispy fried chicken",189,"🍗"],
["Chicken Meal","Chicken, rice and drink",229,"🍗"],
["Spicy Wings","Eight spicy wings",249,"🍗"],
["Chicken Sandwich","Crispy chicken sandwich",169,"🥪"]
]
},

{
name:"Tokyo Bowl",
emoji:"🍜",
category:"Asian",
rating:4.8,
time:"25–35 min",
delivery:39,
items:[
["Beef Ramen","Rich broth and tender beef",299,"🍜"],
["Chicken Ramen","Chicken ramen bowl",279,"🍜"],
["Chicken Katsu","Rice, katsu and sauce",259,"🍱"],
["Gyoza","Six-piece dumplings",149,"🥟"]
]
},

{
name:"Sweet Lab",
emoji:"🍰",
category:"Dessert",
rating:4.6,
time:"15–25 min",
delivery:29,
items:[
["Chocolate Cake","Rich chocolate cake",159,"🍰"],
["Cheesecake","Creamy classic cheesecake",179,"🍰"],
["Milk Tea","Brown sugar milk tea",119,"🧋"],
["Ice Cream","Two scoops",129,"🍨"]
]
}

];

let currentCategory="All";
let cart=[];


/* =========================
HELPERS
========================= */

function peso(n){

return new Intl.NumberFormat(
"en-PH",
{
style:"currency",
currency:"PHP"
}
).format(Number(n)||0);

}


function esc(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
AUTOMATIC RESTAURANT GENERATOR
========================= */

function generateRestaurants(query){

const q=
query.trim() ||
"Food";

const title=
q
.split(/\s+/)
.map(x=>
x.charAt(0).toUpperCase()+x.slice(1)
)
.join(" ");


/* choose suitable emoji */

let emoji="🍽️";

const lower=q.toLowerCase();

if(
lower.includes("burger") ||
lower.includes("mc") ||
lower.includes("fast")
) emoji="🍔";

else if(
lower.includes("pizza")
) emoji="🍕";

else if(
lower.includes("chicken") ||
lower.includes("fried")
) emoji="🍗";

else if(
lower.includes("ramen") ||
lower.includes("noodle") ||
lower.includes("japan") ||
lower.includes("asian")
) emoji="🍜";

else if(
lower.includes("cake") ||
lower.includes("dessert") ||
lower.includes("ice cream") ||
lower.includes("sweet")
) emoji="🍰";

else if(
lower.includes("coffee") ||
lower.includes("cafe")
) emoji="☕";

else if(
lower.includes("milk tea") ||
lower.includes("boba")
) emoji="🧋";


const restaurantNames=[
`${title} House`,
`${title} Kitchen`,
`${title} Express`,
`${title} Corner`,
`${title} Hub`,
`${title} Station`,
`${title} Cafe`,
`${title} Restaurant`,
`${title} Grill`,
`${title} Bistro`,
`${title} Eats`,
`${title} Place`
];


const menuNames=[
`${title} Special`,
`${title} Meal`,
`Classic ${title}`,
`Premium ${title}`,
`Loaded ${title}`,
`Family ${title}`,
`Regular ${title}`,
`Large ${title}`,
`Combo ${title}`,
`Signature ${title}`
];


return restaurantNames.map(
(name,i)=>{

const items=[];

for(let x=0;x<5;x++){

items.push([

menuNames[
(x+i)%menuNames.length
],

`Freshly prepared ${lower} meal. RP-generated menu item.`,

99+
((i*71+x*53)%700),

emoji

]);

}


return {

name:name,

emoji:emoji,

category:"Search",

rating:(4.3+((i%6)*0.1))
.toFixed(1),

time:
(15+(i%5)*5)+
"–"+
(25+(i%5)*5)+
" min",

delivery:
29+(i%4)*10,

items:items

};

});

}


/* =========================
GET SEARCH RESULTS
========================= */

function getRestaurants(){

const query=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


/*
If there is no search:
use the normal restaurants.
*/

if(!query){

return restaurants.filter(r=>

currentCategory==="All" ||
r.category===currentCategory

);

}


/*
First search the built-in restaurants.
*/

const exact=
restaurants.filter(r=>{

const text=(
r.name+
" "+
r.category+
" "+
r.items
.map(x=>x[0])
.join(" ")
).toLowerCase();

return text.includes(query);

});


/*
If search finds something:
show those plus generated
restaurants.

If nothing matches:
generate everything.
*/

const generated=
generateRestaurants(query);

return [
...exact,
...generated
];

}


/* =========================
RENDER
========================= */

function renderRestaurants(){

const box=
document.getElementById(
"restaurants"
);

const results=
getRestaurants();


box.innerHTML=
results.map(
(r,index)=>{

/*
Generated restaurants aren't
inside the original array.

So store them temporarily.
*/

const id=
"result-"+index;

window.currentResults=
results;

return `

<div class="restaurant">

<div class="restImage">

${r.emoji}

</div>

<div class="restBody">

<div class="restTop">

<div class="restName">

${esc(r.name)}

</div>

<div class="rating">

⭐ ${r.rating}

</div>

</div>

<div class="meta">

${esc(r.category)}
•
${r.time}
•
Delivery
${peso(r.delivery)}

</div>

<button
class="menuBtn"
onclick="toggleMenu('${id}')">

View Menu

</button>

</div>


<div
class="menu"
id="menu-${id}">

${r.items.map(
(item,itemIndex)=>`

<div class="item">

<div class="itemEmoji">

${item[3]}

</div>

<div class="itemMain">

<div class="itemName">

${esc(item[0])}

</div>

<div class="itemDesc">

${esc(item[1])}

</div>

<div class="itemPrice">

${peso(item[2])}

</div>

</div>

<button
class="add"
onclick="addGeneratedToCart(${index},${itemIndex})">

+

</button>

</div>

`
).join("")}

</div>

</div>

`;

}).join("");


if(!results.length){

box.innerHTML=`

<div style="
background:white;
padding:30px;
border-radius:20px;
text-align:center">

<h3>
🍽️ Finding food...
</h3>

<p style="
color:#888;
font-size:12px">

Try searching for a food,
restaurant, cuisine or drink.

</p>

</div>

`;

}

}


/* =========================
MENU
========================= */

function toggleMenu(id){

const menu=
document.getElementById(
"menu-"+id
);

if(!menu)return;

menu.style.display=
menu.style.display==="block"
?"none"
:"block";

}


/* =========================
ADD GENERATED / NORMAL FOOD
========================= */

function addGeneratedToCart(
restaurantIndex,
itemIndex
){

const restaurant=
window.currentResults[
restaurantIndex
];

const item=
restaurant.items[
itemIndex
];


const existing=
cart.find(x=>

x.restaurant===restaurant.name &&
x.name===item[0]

);


if(existing){

existing.qty++;

}else{

cart.push({

restaurant:restaurant.name,

name:item[0],

description:item[1],

price:Number(item[2]),

emoji:item[3],

qty:1,

delivery:Number(
restaurant.delivery
)

});

}

updateCart();

}


/* =========================
CART
========================= */

function updateCart(){

const count=
cart.reduce(
(sum,x)=>sum+x.qty,
0
);

document.getElementById(
"cartCount"
).textContent=count;

}


function cartTotal(){

return cart.reduce(
(sum,x)=>
sum+(x.price*x.qty),
0
);

}


function deliveryFee(){

if(!cart.length)
return 0;

return Math.max(
...cart.map(x=>x.delivery)
);

}


function openCart(){

if(!cart.length){

openModal(`

<h2>🛒 Your Cart</h2>

<p style="color:#888">

Your cart is empty.

</p>

`);

return;

}


let html=`

<h2>🛒 Your Cart</h2>

`;


html+=cart.map(
(item,index)=>`

<div class="cartRow">

<div style="font-size:28px">

${item.emoji}

</div>

<div class="cartInfo">

<b>
${esc(item.name)}
</b>

<div style="
font-size:11px;
color:#888">

${esc(item.restaurant)}

</div>

<div style="margin-top:5px">

${peso(item.price)}

</div>

<div class="qty">

<button
onclick="changeQty(${index},-1)">

−

</button>

<b>
${item.qty}
</b>

<button
onclick="changeQty(${index},1)">

+

</button>

</div>

</div>

<div>

${peso(item.price*item.qty)}

</div>

</div>

`
).join("");


const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


html+=`

<div style="margin-top:15px">

<div style="
display:flex;
justify-content:space-between">

<span>Subtotal</span>

<b>
${peso(subtotal)}
</b>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-top:8px">

<span>Delivery</span>

<b>
${peso(delivery)}
</b>

</div>

<hr>

<div style="
display:flex;
justify-content:space-between;
font-size:18px">

<b>Total</b>

<b>
${peso(total)}
</b>

</div>

<button
class="checkout"
onclick="checkout()">

Proceed to Checkout

</button>

</div>

`;

openModal(html);

}


function changeQty(index,amount){

cart[index].qty+=amount;

if(cart[index].qty<=0){

cart.splice(index,1);

}

updateCart();

openCart();

}


/* =========================
CHECKOUT
========================= */

function checkout(){

const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


window.selectedPayment=null;


openModal(`

<h2>
Checkout
</h2>

<div style="
background:#f7f8fa;
padding:14px;
border-radius:14px">

Subtotal:
${peso(subtotal)}

<br><br>

Delivery:
${peso(delivery)}

<hr>

<b>
Total:
${peso(total)}
</b>

</div>

<h3>
Payment Method
</h3>

<div class="payment">

<button
class="pay"
onclick="selectPayment('gcash',this)">

💙 GCash

</button>

<button
class="pay"
onclick="selectPayment('maribank',this)">

🧡 MariBank

</button>

</div>

<button
class="checkout"
onclick="placeOrder()">

Place Order

</button>

`);

}


function selectPayment(
account,
button
){

window.selectedPayment=
account;

document
.querySelectorAll(".pay")
.forEach(
b=>b.classList.remove("selected")
);

button.classList.add("selected");

}


/* =========================
PLACE ORDER
========================= */

function placeOrder(){

if(!window.selectedPayment){

alert(
"Please select GCash or MariBank."
);

return;

}


const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


const payment=
payRP(
window.selectedPayment,
total,
{
name:"FoodDash Order",

description:
cart.map(
x=>
x.qty+
"× "+
x.name
).join(", "),

icon:"🍔"

}
);


if(!payment.success){

alert(payment.message);

return;

}


const order={

id:"FD"+Date.now(),

restaurant:
cart[0].restaurant,

items:
cart.map(x=>({

name:x.name,

qty:x.qty,

price:x.price

})),

subtotal:subtotal,

delivery:delivery,

total:total,

payment:
window.selectedPayment,

status:"Preparing",

date:
new Date()
.toLocaleString("en-PH")

};


if(typeof addFoodpandaOrder==="function"){

addFoodpandaOrder(order);

}else{

/*
Fallback for older rp-data.js.
*/

const data=
loadRP();

if(!data.foodpandaOrders)
data.foodpandaOrders=[];

data.foodpandaOrders.unshift(
order
);

localStorage.setItem(
"rpData",
JSON.stringify(data)
);

}


cart=[];

updateCart();


openModal(`

<h2>
🎉 Order Placed!
</h2>

<p>

Your order from

<strong>
${esc(order.restaurant)}
</strong>

has been placed.

</p>

<div style="
background:#f7f8fa;
padding:14px;
border-radius:14px">

Order:
<strong>
${order.id}
</strong>

<br><br>

Total:
<strong>
${peso(total)}
</strong>

<br><br>

Payment:
<strong>
${
window.selectedPayment==="gcash"
?"GCash"
:"MariBank"
}
</strong>

<br><br>

Status:
<strong>
Preparing
</strong>

</div>

<button
class="checkout"
onclick="closeModal()">

Done

</button>

`);

}


/* =========================
ORDERS
========================= */

function showOrders(){

const data=
loadRP();

const orders=
data.foodpandaOrders||[];

let html=
"<h2>📦 Your Orders</h2>";


if(!orders.length){

html+=`

<p style="color:#888">

No orders yet.

</p>

`;

}else{

html+=orders.map(
o=>`

<div style="
padding:14px 0;
border-bottom:1px solid #eee">

<b>
${esc(o.restaurant)}
</b>

<div style="
font-size:11px;
color:#888;
margin-top:5px">

${o.items.map(
x=>
x.qty+
"× "+
esc(x.name)
).join(", ")}

</div>

<div style="
margin-top:6px">

<strong>
${peso(o.total)}
</strong>

</div>

<div style="
font-size:11px;
color:#e91e48;
margin-top:5px">

${esc(o.status)}

</div>

<div style="
font-size:10px;
color:#999;
margin-top:3px">

${esc(o.date)}

</div>

</div>

`
).join("");

}

openModal(html);

}


/* =========================
SEARCH
========================= */

function searchFood(){

/*
Every keystroke reruns the
generator.

Examples:

burger
pizza
ramen
sushi
coffee
milk tea
jollibee
vacuum
random food
*/

renderRestaurants();

}


/* =========================
CATEGORY
========================= */

function filterCategory(
category,
button
){

currentCategory=
category;

document
.querySelectorAll(".cat")
.forEach(
x=>x.classList.remove("active")
);

button.classList.add("active");

renderRestaurants();

}


/* =========================
MODAL
========================= */

function openModal(html){

document.getElementById(
"modalContent"
).innerHTML=html;

document.getElementById(
"modalBg"
).style.display="flex";

}


function closeModal(){

document.getElementById(
"modalBg"
).style.display="none";

}


/* =========================
START
========================= */

renderRestaurants();

  </script>
