<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FoodDash RP</title>

<script src="rp-data.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  font-family:Arial,sans-serif;
  color:#18202a;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#f7f8fa;
  padding-bottom:85px;
}

.header{
  background:linear-gradient(145deg,#ff315b,#e91e48);
  color:white;
  padding:18px 17px 22px;
  border-radius:0 0 28px 28px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.cartBtn{
  border:0;
  background:#ffffff22;
  color:white;
  border-radius:14px;
  padding:9px 12px;
  font-size:18px;
}

.location{
  margin-top:18px;
  font-size:12px;
  opacity:.9;
}

.search{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:15px;
  padding:14px;
  font-size:14px;
  outline:none;
}

.body{
  padding:15px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.cat{
  white-space:nowrap;
  border:0;
  background:white;
  padding:10px 14px;
  border-radius:20px;
  box-shadow:0 2px 7px #0000000c;
}

.cat.active{
  background:#ff315b;
  color:white;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:17px 2px 10px;
}

.section h3{
  margin:0;
  font-size:17px;
}

.restaurant{
  background:white;
  border-radius:20px;
  margin-bottom:13px;
  overflow:hidden;
  box-shadow:0 3px 12px #0000000b;
}

.restImage{
  height:125px;
  background:linear-gradient(135deg,#ffcf70,#ff7a59);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.restBody{
  padding:13px;
}

.restTop{
  display:flex;
  justify-content:space-between;
}

.restName{
  font-weight:800;
  font-size:16px;
}

.rating{
  font-size:12px;
  color:#e59600;
}

.meta{
  color:#7c8490;
  font-size:11px;
  margin-top:5px;
}

.menuBtn{
  width:100%;
  border:0;
  background:#fff0f3;
  color:#e91e48;
  padding:11px;
  border-radius:12px;
  margin-top:11px;
  font-weight:bold;
}

.menu{
  display:none;
  padding:0 13px 13px;
}

.item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-top:1px solid #edf0f3;
}

.itemEmoji{
  width:48px;
  height:48px;
  border-radius:13px;
  background:#fff3e8;
  display:grid;
  place-items:center;
  font-size:26px;
}

.itemMain{
  flex:1;
}

.itemName{
  font-weight:bold;
  font-size:13px;
}

.itemDesc{
  color:#818995;
  font-size:10px;
  margin-top:4px;
}

.itemPrice{
  margin-top:5px;
  font-weight:800;
  font-size:13px;
}

.add{
  align-self:center;
  border:0;
  background:#ff315b;
  color:white;
  border-radius:11px;
  width:34px;
  height:34px;
  font-size:20px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:72px;
  background:white;
  border-top:1px solid #e4e8ed;
  display:flex;
  z-index:10;
}

.bottom button{
  flex:1;
  border:0;
  background:none;
  font-size:10px;
  color:#7c8490;
}

.bottom span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.modalBg{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:30;
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.close{
  float:right;
  border:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#eef1f4;
}

.cartRow{
  display:flex;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.cartInfo{
  flex:1;
}

.qty{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:7px;
}

.qty button{
  border:0;
  width:28px;
  height:28px;
  border-radius:8px;
  background:#f0f2f5;
}

.checkout{
  width:100%;
  border:0;
  padding:15px;
  border-radius:14px;
  background:#ff315b;
  color:white;
  font-weight:bold;
  margin-top:12px;
}

.payment{
  display:grid;
  gap:8px;
  margin:12px 0;
}

.pay{
  border:1px solid #ddd;
  padding:13px;
  border-radius:13px;
  background:white;
  text-align:left;
}

.pay.selected{
  border:2px solid #ff315b;
  background:#fff3f5;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="top">

<div class="logo">
FoodDash
</div>

<button class="cartBtn"
onclick="openCart()">
🛒 <span id="cartCount">0</span>
</button>

</div>

<div class="location">
📍 RP Home
</div>

<input
id="search"
class="search"
placeholder="Search food, restaurants..."
oninput="searchFood()">

</div>


<div class="body">

<div class="categories">

<button class="cat active"
onclick="filterCategory('All',this)">
All
</button>

<button class="cat"
onclick="filterCategory('Burgers',this)">
🍔 Burgers
</button>

<button class="cat"
onclick="filterCategory('Pizza',this)">
🍕 Pizza
</button>

<button class="cat"
onclick="filterCategory('Chicken',this)">
🍗 Chicken
</button>

<button class="cat"
onclick="filterCategory('Asian',this)">
🍜 Asian
</button>

<button class="cat"
onclick="filterCategory('Dessert',this)">
🍰 Dessert
</button>

</div>


<div class="section">
<h3>Restaurants near you</h3>
</div>

<div id="restaurants"></div>

</div>


<div class="bottom">

<button onclick="location.href='index.html'">
<span>⌂</span>
Home
</button>

<button onclick="showOrders()">
<span>📦</span>
Orders
</button>

<button onclick="openCart()">
<span>🛒</span>
Cart
</button>

</div>

</div>


<div class="modalBg"
id="modalBg">

<div class="modal">

<button class="close"
onclick="closeModal()">
×
</button>

<div id="modalContent"></div>

</div>

</div>


<script>

const restaurants=[

{
name:"Burger House",
emoji:"🍔",
category:"Burgers",
rating:4.8,
time:"20–30 min",
delivery:39,
items:[
["Classic Cheeseburger","Juicy beef patty, cheese and sauce",159,"🍔"],
["Double Burger","Two beef patties with cheese",229,"🍔"],
["Crispy Chicken Burger","Crispy chicken and mayo",179,"🍗"],
["Fries","Crispy salted fries",89,"🍟"]
]
},

{
name:"Pizza Corner",
emoji:"🍕",
category:"Pizza",
rating:4.7,
time:"25–35 min",
delivery:49,
items:[
["Pepperoni Pizza","Classic pepperoni and cheese",399,"🍕"],
["Hawaiian Pizza","Ham, pineapple and cheese",389,"🍕"],
["Four Cheese","Four-cheese blend",429,"🧀"],
["Garlic Bread","Toasted garlic bread",129,"🥖"]
]
},

{
name:"Chicken Republic",
emoji:"🍗",
category:"Chicken",
rating:4.9,
time:"20–30 min",
delivery:35,
items:[
["2pc Fried Chicken","Crispy fried chicken",189,"🍗"],
["Chicken Meal","Chicken, rice and drink",229,"🍗"],
["Spicy Wings","Eight spicy wings",249,"🍗"],
["Chicken Sandwich","Crispy chicken sandwich",169,"🥪"]
]
},

{
name:"Tokyo Bowl",
emoji:"🍜",
category:"Asian",
rating:4.8,
time:"25–35 min",
delivery:39,
items:[
["Beef Ramen","Rich broth and tender beef",299,"🍜"],
["Chicken Ramen","Chicken ramen bowl",279,"🍜"],
["Chicken Katsu","Rice, katsu and sauce",259,"🍱"],
["Gyoza","Six-piece dumplings",149,"🥟"]
]
},

{
name:"Sweet Lab",
emoji:"🍰",
category:"Dessert",
rating:4.6,
time:"15–25 min",
delivery:29,
items:[
["Chocolate Cake","Rich chocolate cake",159,"🍰"],
["Cheesecake","Creamy classic cheesecake",179,"🍰"],
["Milk Tea","Brown sugar milk tea",119,"🧋"],
["Ice Cream","Two scoops",129,"🍨"]
]
}

];


let currentCategory="All";
let cart=[];


function peso(n){

return new Intl.NumberFormat(
"en-PH",
{
style:"currency",
currency:"PHP"
}
).format(n);

}


function renderRestaurants(){

const query=
document.getElementById("search")
.value
.toLowerCase();

const box=
document.getElementById(
"restaurants"
);

const filtered=
restaurants.filter(r=>{

const categoryOK=
currentCategory==="All" ||
r.category===currentCategory;

const text=
(
r.name+
" "+
r.category+
" "+
r.items.map(x=>x[0]).join(" ")
).toLowerCase();

return categoryOK &&
text.includes(query);

});


box.innerHTML=
filtered.map(
(r,index)=>`

<div class="restaurant">

<div class="restImage">
${r.emoji}
</div>

<div class="restBody">

<div class="restTop">

<div class="restName">
${r.name}
</div>

<div class="rating">
⭐ ${r.rating}
</div>

</div>

<div class="meta">
${r.category} • ${r.time} • Delivery ${peso(r.delivery)}
</div>

<button
class="menuBtn"
onclick="toggleMenu(${restaurants.indexOf(r)})">

View Menu

</button>

</div>

<div
class="menu"
id="menu-${restaurants.indexOf(r)}">

${r.items.map(
(item,itemIndex)=>`

<div class="item">

<div class="itemEmoji">
${item[3]}
</div>

<div class="itemMain">

<div class="itemName">
${item[0]}
</div>

<div class="itemDesc">
${item[1]}
</div>

<div class="itemPrice">
${peso(item[2])}
</div>

</div>

<button
class="add"
onclick="addToCart(
${restaurants.indexOf(r)},
${itemIndex}
)">

+

</button>

</div>

`
).join("")}

</div>

</div>

`
).join("");


if(!filtered.length){

box.innerHTML=`

<div style="
background:white;
padding:30px;
border-radius:20px;
text-align:center">

<h3>
No exact match
</h3>

<p style="color:#888;font-size:12px">

Try another food or restaurant.

</p>

</div>

`;

}

}


function toggleMenu(index){

const menu=
document.getElementById(
"menu-"+index
);

menu.style.display=
menu.style.display==="block"
?"none"
:"block";

}


function addToCart(r,i){

const restaurant=
restaurants[r];

const item=
restaurant.items[i];

const existing=
cart.find(
x=>x.restaurant===restaurant.name &&
x.name===item[0]
);

if(existing){

existing.qty++;

}else{

cart.push({

restaurant:restaurant.name,

name:item[0],

description:item[1],

price:item[2],

emoji:item[3],

qty:1,

delivery:restaurant.delivery

});

}

updateCart();

}


function updateCart(){

let count=0;

cart.forEach(
x=>count+=x.qty
);

document.getElementById(
"cartCount"
).textContent=count;

}


function cartTotal(){

return cart.reduce(
(sum,x)=>
sum+(x.price*x.qty),
0
);

}


function deliveryFee(){

if(!cart.length)
return 0;

return Math.max(
...cart.map(x=>x.delivery)
);

}


function openCart(){

if(!cart.length){

openModal(`

<h2>🛒 Your Cart</h2>

<p style="color:#888">
Your cart is empty.
</p>

`);

return;

}


let html=`

<h2>🛒 Your Cart</h2>
`;


html+=cart.map(
(item,index)=>`

<div class="cartRow">

<div style="font-size:28px">
${item.emoji}
</div>

<div class="cartInfo">

<b>
${item.name}
</b>

<div style="font-size:11px;color:#888">
${item.restaurant}
</div>

<div style="margin-top:5px">
${peso(item.price)}
</div>

<div class="qty">

<button
onclick="changeQty(${index},-1)">
−
</button>

<b>${item.qty}</b>

<button
onclick="changeQty(${index},1)">
+
</button>

</div>

</div>

<div>
${peso(item.price*item.qty)}
</div>

</div>

`
).join("");


const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


html+=`

<div style="
margin-top:15px">

<div style="
display:flex;
justify-content:space-between">

<span>Subtotal</span>
<b>${peso(subtotal)}</b>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-top:8px">

<span>Delivery</span>
<b>${peso(delivery)}</b>

</div>

<hr>

<div style="
display:flex;
justify-content:space-between;
font-size:18px">

<b>Total</b>
<b>${peso(total)}</b>

</div>

<button
class="checkout"
onclick="checkout()">

Proceed to Checkout

</button>

</div>

`;

openModal(html);

}


function changeQty(index,amount){

cart[index].qty+=amount;

if(cart[index].qty<=0){

cart.splice(index,1);

}

updateCart();

openCart();

}


function checkout(){

const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


openModal(`

<h2>Checkout</h2>

<p>
Total:
<strong>${peso(total)}</strong>
</p>

<h3>Payment method</h3>

<div class="payment">

<button
class="pay"
onclick="selectPayment('gcash',this)">

💙 GCash

</button>

<button
class="pay"
onclick="selectPayment('maribank',this)">

🧡 MariBank

</button>

</div>

<button
class="checkout"
onclick="placeOrder()">

Place Order

</button>

`);

window.selectedPayment=null;

}


function selectPayment(account,button){

window.selectedPayment=account;

document
.querySelectorAll(".pay")
.forEach(
b=>b.classList.remove("selected")
);

button.classList.add("selected");

}


function placeOrder(){

if(!window.selectedPayment){

alert(
"Please select GCash or MariBank."
);

return;

}


const subtotal=
cartTotal();

const delivery=
deliveryFee();

const total=
subtotal+delivery;


const payment=
payRP(
window.selectedPayment,
total,
{
name:"FoodDash Order",
description:
cart.map(
x=>x.qty+"× "+x.name
).join(", "),
icon:"🍔"
}
);


if(!payment.success){

alert(payment.message);
return;

}


const order={

id:"FD"+Date.now(),

restaurant:
cart[0].restaurant,

items:
cart.map(x=>({
name:x.name,
qty:x.qty,
price:x.price
})),

subtotal:subtotal,

delivery:delivery,

total:total,

payment:
window.selectedPayment,

status:"Preparing",

date:new Date().toLocaleString("en-PH")

};


addFoodpandaOrder(order);

cart=[];

updateCart();

openModal(`

<h2>🎉 Order placed!</h2>

<p>
Your order has been sent to
<strong>${order.restaurant}</strong>.
</p>

<p>
Total paid:
<strong>${peso(total)}</strong>
</p>

<p style="color:#777">
Payment:
${
window.selectedPayment==="gcash"
?"GCash"
:"MariBank"
}
</p>

<button
class="checkout"
onclick="closeModal()">

Done

</button>

`);

}


function showOrders(){

const data=
loadRP();

let html=
"<h2>📦 Your Orders</h2>";

if(!data.foodpandaOrders.length){

html+=`
<p style="color:#888">
No orders yet.
</p>
`;

}else{

html+=
data.foodpandaOrders
.map(
o=>`

<div style="
padding:14px 0;
border-bottom:1px solid #eee">

<b>
${o.restaurant}
</b>

<div style="
font-size:11px;
color:#888;
margin-top:5px">

${o.items.map(
x=>x.qty+"× "+x.name
).join(", ")}

</div>

<div style="
margin-top:6px">

<strong>
${peso(o.total)}
</strong>

</div>

<div style="
font-size:11px;
color:#e91e48;
margin-top:5px">

${o.status}

</div>

<div style="
font-size:10px;
color:#999;
margin-top:3px">

${o.date}

</div>

</div>

`
).join("");

}

openModal(html);

}


function searchFood(){

renderRestaurants();

}


function filterCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".cat")
.forEach(
x=>x.classList.remove("active")
);

button.classList.add("active");

renderRestaurants();

}


function openModal(html){

document.getElementById(
"modalContent"
).innerHTML=html;

document.getElementById(
"modalBg"
).style.display="flex";

}


function closeModal(){

document.getElementById(
"modalBg"
).style.display="none";

}


renderRestaurants();

</script>

</body>
  </html>
