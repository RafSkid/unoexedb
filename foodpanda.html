<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FoodDash RP</title>

<script src="rp-data.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111827;
    font-family:Arial,sans-serif;
    color:#18202a;
}

button,
input{
    font-family:inherit;
}

.app{
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#f7f8fa;
    padding-bottom:85px;
}

/* HEADER */

.header{
    background:linear-gradient(145deg,#ff315b,#e91e48);
    color:white;
    padding:18px 17px 22px;
    border-radius:0 0 28px 28px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:23px;
    font-weight:900;
}

.cartBtn{
    border:0;
    background:#ffffff25;
    color:white;
    border-radius:14px;
    padding:9px 12px;
    font-size:18px;
    cursor:pointer;
}

.search{
    width:100%;
    margin-top:15px;
    border:0;
    border-radius:15px;
    padding:14px;
    font-size:14px;
    outline:none;
}

/* BODY */

.body{
    padding:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.cat{
    white-space:nowrap;
    border:0;
    background:white;
    padding:10px 14px;
    border-radius:20px;
    box-shadow:0 2px 7px #0000000c;
    cursor:pointer;
}

.cat.active{
    background:#ff315b;
    color:white;
}

.searchInfo{
    margin-top:13px;
    background:white;
    border-radius:15px;
    padding:12px;
    font-size:11px;
    color:#777;
    display:none;
}

.section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:17px 2px 10px;
}

.section h3{
    margin:0;
    font-size:17px;
}

/* RESTAURANTS */

.restaurant{
    background:white;
    border-radius:20px;
    margin-bottom:13px;
    overflow:hidden;
    box-shadow:0 3px 12px #0000000b;
}

.restImage{
    height:125px;
    background:linear-gradient(135deg,#ffcf70,#ff7a59);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.restBody{
    padding:13px;
}

.restTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.restName{
    font-weight:800;
    font-size:16px;
}

.rating{
    font-size:12px;
    color:#e59600;
    white-space:nowrap;
}

.meta{
    color:#7c8490;
    font-size:11px;
    margin-top:5px;
}

.menuBtn{
    width:100%;
    border:0;
    background:#fff0f3;
    color:#e91e48;
    padding:11px;
    border-radius:12px;
    margin-top:11px;
    font-weight:bold;
    cursor:pointer;
}

.menu{
    display:none;
    padding:0 13px 13px;
}

.item{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-top:1px solid #edf0f3;
}

.itemEmoji{
    width:48px;
    min-width:48px;
    height:48px;
    border-radius:13px;
    background:#fff3e8;
    display:grid;
    place-items:center;
    font-size:26px;
}

.itemMain{
    flex:1;
    min-width:0;
}

.itemName{
    font-weight:bold;
    font-size:13px;
}

.itemDesc{
    color:#818995;
    font-size:10px;
    margin-top:4px;
}

.itemPrice{
    margin-top:5px;
    font-weight:800;
    font-size:13px;
}

.add{
    align-self:center;
    border:0;
    background:#ff315b;
    color:white;
    border-radius:11px;
    width:34px;
    height:34px;
    font-size:20px;
    cursor:pointer;
}

/* BOTTOM */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(480px,100%);
    height:72px;
    background:white;
    border-top:1px solid #e4e8ed;
    display:flex;
    z-index:10;
}

.bottom button{
    flex:1;
    border:0;
    background:none;
    font-size:10px;
    color:#7c8490;
    cursor:pointer;
}

.bottom span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

/* MODAL */

.modalBg{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:flex-end;
    z-index:30;
}

.modal{
    width:min(480px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:25px 25px 0 0;
    padding:20px;
}

.close{
    float:right;
    border:0;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#eef1f4;
    font-size:18px;
    cursor:pointer;
}

/* CART */

.cartRow{
    display:flex;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.cartInfo{
    flex:1;
    min-width:0;
}

.qty{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:7px;
}

.qty button{
    border:0;
    width:28px;
    height:28px;
    border-radius:8px;
    background:#f0f2f5;
    cursor:pointer;
}

.checkout{
    width:100%;
    border:0;
    padding:15px;
    border-radius:14px;
    background:#ff315b;
    color:white;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

.secondary{
    width:100%;
    border:0;
    padding:13px;
    border-radius:14px;
    background:#eef0f3;
    margin-top:8px;
    cursor:pointer;
}

/* PAYMENT */

.payment{
    display:grid;
    gap:8px;
    margin:12px 0;
}

.pay{
    border:1px solid #ddd;
    padding:13px;
    border-radius:13px;
    background:white;
    text-align:left;
    cursor:pointer;
}

.pay.selected{
    border:2px solid #ff315b;
    background:#fff3f5;
}

/* BALANCE */

.balanceBox{
    padding:14px;
    border-radius:15px;
    background:#f7f8fa;
    margin-bottom:12px;
}

.balanceRow{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
}

/* EMPTY */

.empty{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    color:#777;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

    <div class="top">

        <div class="logo">
            🍔 FoodDash
        </div>

        <button
            class="cartBtn"
            onclick="openCart()">

            🛒 <span id="cartCount">0</span>

        </button>

    </div>

    <div style="
        margin-top:15px;
        font-size:11px;
        opacity:.9">

        📍 RP Home

    </div>

    <input
        id="search"
        class="search"
        placeholder="Search food, restaurant, anything..."
        oninput="searchFood()">

</div>


<!-- BODY -->

<div class="body">

    <div class="categories">

        <button
            class="cat active"
            onclick="filterCategory('All',this)">

            All

        </button>

        <button
            class="cat"
            onclick="filterCategory('Burgers',this)">

            🍔 Burgers

        </button>

        <button
            class="cat"
            onclick="filterCategory('Pizza',this)">

            🍕 Pizza

        </button>

        <button
            class="cat"
            onclick="filterCategory('Chicken',this)">

            🍗 Chicken

        </button>

        <button
            class="cat"
            onclick="filterCategory('Asian',this)">

            🍜 Asian

        </button>

        <button
            class="cat"
            onclick="filterCategory('Dessert',this)">

            🍰 Dessert

        </button>

        <button
            class="cat"
            onclick="filterCategory('Drinks',this)">

            🧋 Drinks

        </button>

    </div>


    <div
        id="searchInfo"
        class="searchInfo">
    </div>


    <div class="section">

        <h3>
            Restaurants near you
        </h3>

        <span
            id="resultCount"
            style="font-size:10px;color:#888">
        </span>

    </div>


    <div id="restaurants"></div>

</div>


<!-- BOTTOM -->

<div class="bottom">

    <button onclick="location.href='index.html'">

        <span>⌂</span>
        Home

    </button>

    <button onclick="showOrders()">

        <span>📦</span>
        Orders

    </button>

    <button onclick="openCart()">

        <span>🛒</span>
        Cart

    </button>

</div>

</div>


<!-- MODAL -->

<div
    class="modalBg"
    id="modalBg">

    <div class="modal">

        <button
            class="close"
            onclick="closeModal()">

            ×

        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =====================================================
   BASE RESTAURANTS
===================================================== */

const restaurants=[

{

    category:"Burgers",
    rating:4.8,

    delivery:39,
    items:[

        ["Double Burger","Two beef patties with cheese",229,"🍔"],
        ["Crispy Chicken Burger","Crispy chicken and mayo",179,"🍗"],

    ]
},

{

        ["Four Cheese","Four-cheese blend",429,"🧀"],

        ["Meat Lovers","Loaded meat and cheese",459,"🍕"]
    ]
},

{

    delivery:35,
    items:[

        ["Chicken Meal","Chicken, rice and drink",229,"🍗"],
        ["Spicy Wings","Eight spicy wings",249,"🍗"],
        ["Chicken Sandwich","Crispy chicken sandwich",169,"🥪"],
        ["Chicken Bucket","Family chicken bucket",599,"🍗"]
    ]
},

{
    name:"Tokyo Bowl",
    emoji:"🍜",
    category:"Asian",
    rating:4.8,
    time:"25–35 min",
    delivery:39,
    items:[
        ["Beef Ramen","Rich broth and tender beef",299,"🍜"],
        ["Chicken Ramen","Chicken ramen bowl",279,"🍜"],
        ["Chicken Katsu","Rice, katsu and sauce",259,"🍱"],
        ["Gyoza","Six-piece dumplings",149,"🥟"],
        ["Beef Teriyaki","Rice and grilled beef",319,"🥩"]
    ]
},

{
    name:"Sweet Lab",
    emoji:"🍰",
    category:"Dessert",
    rating:4.6,
    time:"15–25 min",
    delivery:29,
    items:[
        ["Chocolate Cake","Rich chocolate cake",159,"🍰"],
        ["Cheesecake","Creamy classic cheesecake",179,"🍰"],
        ["Milk Tea","Brown sugar milk tea",119,"🧋"],
        ["Ice Cream","Two scoops",129,"🍨"],
        ["Brownie","Warm chocolate brownie",139,"🍫"]
    ]
},

{
    name:"Coffee District",
    emoji:"☕",
    category:"Drinks",
    rating:4.7,
    time:"10–20 min",
    delivery:25,
    items:[
        ["Iced Coffee","Cold brewed coffee",129,"☕"],
        ["Caramel Latte","Sweet caramel latte",159,"☕"],
        ["Spanish Latte","Creamy Spanish latte",169,"☕"],
        ["Matcha Latte","Creamy matcha drink",179,"🍵"],
        ["Chocolate Frappe","Cold chocolate frappe",189,"🥤"]
    ]
},

{
    name:"Sushi Station",
    emoji:"🍣",
    category:"Asian",
    rating:4.8,
    time:"25–40 min",
    delivery:45,
    items:[
        ["Salmon Sushi","Fresh salmon sushi",299,"🍣"],
        ["California Roll","Crab, avocado and rice",249,"🍣"],
        ["Tuna Roll","Tuna sushi roll",279,"🍣"],
        ["Tempura","Crispy shrimp tempura",319,"🍤"],
        ["Sushi Combo","Assorted sushi platter",499,"🍣"]
    ]
}

];


/* =====================================================
   STATE
===================================================== */

let currentCategory="All";

let cart=[];

let currentResults=[];

let selectedPayment=null;


/* =====================================================
   HELPERS
===================================================== */

function peso(amount){

    return new Intl.NumberFormat(
        "en-PH",
        {
            style:"currency",
            currency:"PHP"
        }
    ).format(Number(amount)||0);

}


function esc(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   RANDOM GENERATOR
===================================================== */

function generateRestaurants(query){

    let q=query.trim();

    if(!q){
        q="Food";
    }

    const lower=q.toLowerCase();

    const title=q
        .split(/\s+/)
        .map(word=>
            word.charAt(0).toUpperCase()+
            word.slice(1)
        )
        .join(" ");


    let emoji="🍽️";


    if(
        lower.includes("burger")||
        lower.includes("hamburger")
    ){
        emoji="🍔";
    }

    else if(
        lower.includes("pizza")
    ){
        emoji="🍕";
    }

    else if(
        lower.includes("chicken")||
        lower.includes("fried")
    ){
        emoji="🍗";
    }

    else if(
        lower.includes("ramen")||
        lower.includes("noodle")||
        lower.includes("japan")||
        lower.includes("asian")
    ){
        emoji="🍜";
    }

    else if(
        lower.includes("sushi")||
        lower.includes("salmon")
    ){
        emoji="🍣";
    }

    else if(
        lower.includes("coffee")||
        lower.includes("cafe")
    ){
        emoji="☕";
    }

    else if(
        lower.includes("milk")||
        lower.includes("boba")||
        lower.includes("drink")
    ){
        emoji="🧋";
    }

    else if(
        lower.includes("cake")||
        lower.includes("dessert")||
        lower.includes("sweet")||
        lower.includes("ice cream")
    ){
        emoji="🍰";
    }

    else if(
        lower.includes("fries")
    ){
        emoji="🍟";
    }


    const restaurantTypes=[
        "House",
        "Kitchen",
        "Express",
        "Corner",
        "Hub",
        "Station",
        "Cafe",
        "Restaurant",
        "Grill",
        "Bistro",
        "Eats",
        "Place",
        "Kitchen & Grill",
        "Food Hub",
        "Diner",
        "Central",
        "Market"
    ];


    const menuTypes=[
        "Special",
        "Classic",
        "Premium",
        "Deluxe",
        "Signature",
        "Best Seller",
        "Combo",
        "Large",
        "Regular",
        "Family Meal",
        "Value Meal",
        "Ultimate",
        "Loaded",
        "Original",
        "Extra"
    ];


    const results=[];


    for(let i=0;i<18;i++){

        const restaurantName=
            title+
            " "+
            restaurantTypes[
                i%restaurantTypes.length
            ];


        const items=[];


        for(let x=0;x<8;x++){

            const menuName=
                menuTypes[
                    (x+i)%
                    menuTypes.length
                ]+
                " "+
                title;


            const price=
                79+
                ((i*83+x*47)%720);


            items.push([

                menuName,

                "Freshly prepared "+
                lower+
                " meal made for RP delivery.",

                price,

                emoji

            ]);

        }


        results.push({

            name:restaurantName,

            emoji:emoji,

            category:"Search",

            rating:
                (4.2+((i%8)*0.1))
                .toFixed(1),

            time:
                (15+(i%6)*5)+
                "–"+
                (25+(i%6)*5)+
                " min",

            delivery:
                25+(i%5)*10,

            items:items

        });

    }


    return results;

}


/* =====================================================
   SEARCH RESULTS
===================================================== */

function getRestaurants(){

    const input=
        document.getElementById("search");

    const query=
        input
        ? input.value.toLowerCase().trim()
        :"";


    if(!query){

        return restaurants.filter(r=>

            currentCategory==="All"||
            r.category===currentCategory

        );

    }


    const exact=
        restaurants.filter(r=>{

            const text=(
                r.name+
                " "+
                r.category+
                " "+
                r.items
                    .map(item=>item[0])
                    .join(" ")
            ).toLowerCase();


            return text.includes(query);

        });


    /*
       ALWAYS generate extra results
       for searched terms.
    */

    const generated=
        generateRestaurants(query);


    return [
        ...exact,
        ...generated
    ];

}


/* =====================================================
   RENDER
===================================================== */

function renderRestaurants(){

    const box=
        document.getElementById(
            "restaurants"
        );


    if(!box){
        return;
    }


    currentResults=
        getRestaurants();


    const info=
        document.getElementById(
            "searchInfo"
        );


    const search=
        document.getElementById(
            "search"
        );


    if(search && info){

        if(search.value.trim()){

            info.style.display="block";

            info.textContent=
                "✨ RP search generated "+
                currentResults.length+
                " restaurants for “"+
                search.value+
                "”";

        }

        else{

            info.style.display="none";

        }

    }


    const count=
        document.getElementById(
            "resultCount"
        );


    if(count){

        count.textContent=
            currentResults.length+
            " results";

    }


    box.innerHTML=
        currentResults
        .map((restaurant,index)=>{

            const menuId=
                "menu-"+index;


            return `

            <div class="restaurant">

                <div class="restImage">

                    ${restaurant.emoji}

                </div>


                <div class="restBody">

                    <div class="restTop">

                        <div class="restName">

                            ${esc(
                                restaurant.name
                            )}

                        </div>

                        <div class="rating">

                            ⭐
                            ${restaurant.rating}

                        </div>

                    </div>


                    <div class="meta">

                        ${esc(
                            restaurant.category
                        )}

                        •
                        ${restaurant.time}

                        • Delivery
                        ${peso(
                            restaurant.delivery
                        )}

                    </div>


                    <button
                        class="menuBtn"
                        onclick="
                            toggleMenu(${index})
                        ">

                        View Menu

                    </button>

                </div>


                <div
                    class="menu"
                    id="${menuId}">

                    ${restaurant.items
                        .map((item,itemIndex)=>`

                        <div class="item">

                            <div class="itemEmoji">

                                ${item[3]}

                            </div>


                            <div class="itemMain">

                                <div class="itemName">

                                    ${esc(
                                        item[0]
                                    )}

                                </div>


                                <div class="itemDesc">

                                    ${esc(
                                        item[1]
                                    )}

                                </div>


                                <div class="itemPrice">

                                    ${peso(
                                        item[2]
                                    )}

                                </div>

                            </div>


                            <button
                                class="add"
                                onclick="
                                    addToCart(
                                        ${index},
                                        ${itemIndex}
                                    )
                                ">

                                +

                            </button>

                        </div>

                        `)
                        .join("")}

                </div>

            </div>

            `;

        })
        .join("");


    if(!currentResults.length){

        box.innerHTML=`

        <div class="empty">

            <div style="font-size:45px">
                🍽️
            </div>

            <h3>
                No restaurants found
            </h3>

            <p>
                Try searching for anything.
            </p>

        </div>

        `;

    }

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu(index){

    const menu=
        document.getElementById(
            "menu-"+index
        );


    if(!menu){
        return;
    }


    menu.style.display=
        menu.style.display==="block"
        ?"none"
        :"block";

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
    restaurantIndex,
    itemIndex
){

    const restaurant=
        currentResults[
            restaurantIndex
        ];


    if(!restaurant){
        return;
    }


    const item=
        restaurant.items[
            itemIndex
        ];


    if(!item){
        return;
    }


    const existing=
        cart.find(x=>

            x.restaurant===
            restaurant.name&&

            x.name===
            item[0]

        );


    if(existing){

        existing.qty++;

    }

    else{

        cart.push({

            restaurant:
                restaurant.name,

            name:
                item[0],

            description:
                item[1],

            price:
                Number(item[2]),

            emoji:
                item[3],

            qty:1,

            delivery:
                Number(
                    restaurant.delivery
                )

        });

    }


    updateCart();


    /*
       Small visual confirmation.
    */

    showToast(
        "Added to cart ✓"
    );

}


/* =====================================================
   CART
===================================================== */

function updateCart(){

    const count=
        cart.reduce(
            (sum,item)=>
                sum+item.qty,
            0
        );


    const element=
        document.getElementById(
            "cartCount"
        );


    if(element){

        element.textContent=
            count;

    }

}


function cartTotal(){

    return cart.reduce(
        (sum,item)=>
            sum+
            (
                item.price*
                item.qty
            ),
        0
    );

}


function deliveryFee(){

    if(!cart.length){
        return 0;
    }


    return Math.max(
        ...cart.map(
            item=>
                Number(
                    item.delivery
                )||0
        )
    );

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart(){

    if(!cart.length){

        openModal(`

            <h2>
                🛒 Your Cart
            </h2>

            <div class="empty">

                <div style="font-size:40px">
                    🛒
                </div>

                <p>
                    Your cart is empty.
                </p>

            </div>

        `);

        return;

    }


    let html=`

        <h2>
            🛒 Your Cart
        </h2>

    `;


    html+=cart.map(
        (item,index)=>`

        <div class="cartRow">

            <div style="font-size:28px">

                ${item.emoji}

            </div>


            <div class="cartInfo">

                <b>
                    ${esc(item.name)}
                </b>

                <div style="
                    font-size:11px;
                    color:#888;
                    margin-top:3px">

                    ${esc(
                        item.restaurant
                    )}

                </div>


                <div style="
                    margin-top:5px">

                    ${peso(item.price)}

                </div>


                <div class="qty">

                    <button
                        onclick="
                            changeQty(
                                ${index},
                                -1
                            )
                        ">

                        −

                    </button>


                    <b>
                        ${item.qty}
                    </b>


                    <button
                        onclick="
                            changeQty(
                                ${index},
                                1
                            )
                        ">

                        +

                    </button>

                </div>

            </div>


            <div>

                <b>
                    ${peso(
                        item.price*
                        item.qty
                    )}
                </b>

            </div>

        </div>

        `
    ).join("");


    const subtotal=
        cartTotal();

    const delivery=
        deliveryFee();

    const total=
        subtotal+
        delivery;


    html+=`

        <div style="
            margin-top:15px">

            <div class="balanceRow">

                <span>
                    Subtotal
                </span>

                <b>
                    ${peso(subtotal)}
                </b>

            </div>


            <div class="balanceRow">

                <span>
                    Delivery
                </span>

                <b>
                    ${peso(delivery)}
                </b>

            </div>


            <hr>


            <div class="balanceRow"
                style="font-size:18px">

                <b>
                    Total
                </b>

                <b>
                    ${peso(total)}
                </b>

            </div>


            <button
                class="checkout"
                onclick="checkout()">

                Proceed to Checkout

            </button>

        </div>

    `;


    openModal(html);

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQty(
    index,
    amount
){

    if(!cart[index]){
        return;
    }


    cart[index].qty+=
        amount;


    if(cart[index].qty<=0){

        cart.splice(
            index,
            1
        );

    }


    updateCart();


    if(cart.length){

        openCart();

    }

    else{

        openCart();

    }

}


/* =====================================================
   CHECKOUT
===================================================== */

function checkout(){

    if(!cart.length){

        return;

    }


    const subtotal=
        cartTotal();

    const delivery=
        deliveryFee();

    const total=
        subtotal+
        delivery;


    selectedPayment=
        null;


    openModal(`

        <h2>
            Checkout
        </h2>


        <div style="
            background:#f7f8fa;
            padding:14px;
            border-radius:14px">

            <div class="balanceRow">

                <span>
                    Subtotal
                </span>

                <b>
                    ${peso(subtotal)}
                </b>

            </div>


            <div class="balanceRow">

                <span>
                    Delivery
                </span>

                <b>
                    ${peso(delivery)}
                </b>

            </div>


            <hr>


            <div class="balanceRow"
                style="font-size:18px">

                <b>
                    Total
                </b>

                <b>
                    ${peso(total)}
                </b>

            </div>

        </div>


        <h3>
            💳 Payment Method
        </h3>


        <div class="payment">

            <button
                class="pay"
                onclick="
                    selectPayment(
                        'gcash',
                        this
                    )
                ">

                💙
                <b>GCash</b>

                <div style="
                    font-size:10px;
                    color:#888;
                    margin-top:3px">

                    Pay using your RP GCash balance

                </div>

            </button>


            <button
                class="pay"
                onclick="
                    selectPayment(
                        'maribank',
                        this
                    )
                ">

                🧡
                <b>MariBank</b>

                <div style="
                    font-size:10px;
                    color:#888;
                    margin-top:3px">

                    Pay using your RP MariBank balance

            </button>

        <button
            class="checkout"
            onclick="placeOrder()">

            🛵 Place Order

        </button>

    `);

}


/* =====================================================
   SELECT PAYMENT
===================================================== */

function selectPayment(
    account,
    button
){

    selectedPayment=
        account;


    document
        .querySelectorAll(".pay")
        .forEach(
            element=>
                element.classList
                .remove("selected")
        );


    button.classList.add(
        "selected"
    );

}


/* =====================================================
   PLACE ORDER
===================================================== */

function placeOrder(){

    if(!selectedPayment){

        alert(
            "Please select GCash or MariBank."
        );

        return;

    }


    if(!cart.length){

        alert(
            "Your cart is empty."
        );

        return;

    }


    const subtotal=
        cartTotal();

    const delivery=
        deliveryFee();

    const total=
        subtotal+
        delivery;


    /*
       IMPORTANT:
       This calls the shared RP
       payment system from rp-data.js.
    */

    if(
        typeof payRP!=="function"
    ){

        alert(
            "rp-data.js is missing or failed to load."
        );

        return;

    }


    const payment=
        payRP(
            selectedPayment,
            total,
            {

                name:
                    "FoodDash Order",

                description:
                    cart.map(
                        item=>
                            item.qty+
                            "× "+
                            item.name
                    ).join(", "),

                icon:"🍔"

            }
        );


    if(!payment.success){

        alert(
            payment.message
        );

        return;

    }


    const order={

        id:
            "FD"+
            Date.now(),

        restaurant:
            cart[0].restaurant,

        items:
            cart.map(
                item=>({

                    name:
                        item.name,

                    qty:
                        item.qty,

                    price:
                        item.price

                })
            ),

        subtotal:
            subtotal,

        delivery:
            delivery,

        total:
            total,

        payment:
            selectedPayment,

        status:
            "Preparing",

        date:
            new Date()
            .toLocaleString(
                "en-PH"
            )

    };


    /*
       Save using the shared
       FoodDash order function.
    */

    if(
        typeof addFoodpandaOrder===
        "function"
    ){

        addFoodpandaOrder(
            order
        );

    }

    else{

        /*
           Direct fallback using
           the same RP key.
        */

        const data=
            loadRP();


        if(
            !Array.isArray(
                data.foodpandaOrders
            )
        ){

            data.foodpandaOrders=[];

        }


        data.foodpandaOrders
            .unshift(order);


        saveRP(data);

    }


    const paymentName=
        selectedPayment===
        "gcash"
        ?"GCash"
        :"MariBank";


    cart=[];

    updateCart();


    openModal(`

        <h2>
            🎉 Order Placed!
        </h2>


        <p>

            Your FoodDash order has
            been successfully placed.

        </p>


        <div style="
            background:#f7f8fa;
            padding:14px;
            border-radius:14px">

            Order ID:

            <br>

            <strong>
                ${order.id}
            </strong>


            <br><br>


            Restaurant:

            <br>

            <strong>
                ${esc(
                    order.restaurant
                )}
            </strong>


            <br><br>


            Total Paid:

            <br>

            <strong>
                ${peso(total)}
            </strong>


            <br><br>


            Payment:

            <br>

            <strong>
                ${paymentName}
            </strong>


            <br><br>


            Status:

            <br>

            <strong
                style="color:#e91e48">

                Preparing

            </strong>

        </div>


        <button
            class="checkout"
            onclick="closeModal()">

            Done

        </button>

    `);

}

/* =====================================================
   MODAL
===================================================== */

function openModal(html){

    const content=
        document.getElementById(
            "modalContent"
        );


    const bg=
        document.getElementById(
            "modalBg"
        );


    if(!content||!bg){

        return;

    }


    content.innerHTML=
        html;


    bg.style.display=
        "flex";

}


function closeModal(){

    const bg=
        document.getElementById(
            "modalBg"
        );


    if(bg){

        bg.style.display=
            "none";

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const old=
        document.getElementById(
            "rpToast"
        );


    if(old){

        old.remove();

    }


    const toast=
        document.createElement(
            "div"
        );


    toast.id=
        "rpToast";


    toast.textContent=
        message;


    toast.style.cssText=`

        position:fixed;
        left:50%;
        bottom:85px;
        transform:translateX(-50%);
        background:#222;
        color:white;
        padding:11px 17px;
        border-radius:20px;
        font-size:12px;
        z-index:100;
        box-shadow:0 5px 20px #0005;

    `;


    document.body.appendChild(
        toast
    );


    setTimeout(
        ()=>{
            toast.remove();
        },
        1600
    );

}
