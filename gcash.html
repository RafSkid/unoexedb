<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GCash RP</title>

<script src="rp-data.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef2f7;
  font-family:Arial,sans-serif;
  color:#172033;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#f7f9fc;
  position:relative;
  padding-bottom:78px;
}

/* TOP */

.top{
  background:linear-gradient(145deg,#0878ed,#0057c9);
  color:white;
  padding:18px 18px 24px;
  border-radius:0 0 28px 28px;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.dots{
  font-size:22px;
}

.greeting{
  margin-top:22px;
  font-size:13px;
  opacity:.85;
}

.bal{
  font-size:36px;
  font-weight:800;
  margin:5px 0 18px;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.action{
  border:0;
  background:#ffffff1c;
  color:#fff;
  border-radius:15px;
  padding:10px 4px;
  font-size:11px;
}

.action b{
  display:block;
  font-size:21px;
  margin-bottom:5px;
}

/* BODY */

.body{
  padding:16px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px 10px;
}

.section h3{
  margin:0;
  font-size:17px;
}

.see{
  color:#0878ed;
  font-size:12px;
  cursor:pointer;
}

/* SERVICES */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.service{
  background:#fff;
  border:0;
  border-radius:16px;
  padding:12px 4px;
  box-shadow:0 2px 8px #15233a0d;
  font-size:10px;
  cursor:pointer;
}

.service span{
  display:block;
  font-size:23px;
  margin-bottom:6px;
}

/* TRANSACTIONS */

.card{
  background:#fff;
  border-radius:20px;
  padding:15px;
  box-shadow:0 2px 10px #15233a0d;
}

.tx{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid #edf0f4;
}

.tx:last-child{
  border-bottom:0;
}

.txicon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#edf5ff;
  display:grid;
  place-items:center;
  font-size:20px;
}

.txmain{
  flex:1;
}

.txmain b{
  font-size:13px;
}

.muted{
  font-size:11px;
  color:#7b8494;
  margin-top:3px;
}

.amount{
  font-size:13px;
  font-weight:800;
}

.out{
  color:#e24b4b;
}

.in{
  color:#129568;
}

/* BOTTOM NAV */

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:70px;
  background:#fff;
  border-top:1px solid #e6e9ee;
  display:flex;
  z-index:10;
}

.nav button{
  flex:1;
  border:0;
  background:none;
  font-size:10px;
  color:#7c8490;
  cursor:pointer;
}

.nav button.active{
  color:#0878ed;
  font-weight:700;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

/* MODAL */

.sheet{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:flex-end;
  z-index:20;
}

.modal{
  background:#fff;
  width:min(480px,100%);
  margin:auto;
  border-radius:25px 25px 0 0;
  padding:20px;
  max-height:85vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:#f0f2f5;
  border-radius:50%;
  width:32px;
  height:32px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <section class="top">

    <div class="topline">

      <div class="brand">
        GCash
      </div>

      <div class="dots">
        ⋯
      </div>

    </div>

    <div class="greeting">
      Good day, RP user
    </div>

    <div class="bal" id="balance">
      ₱0.00
    </div>

    <div class="actions">

      <button class="action" onclick="demo('Send Money')">
        <b>↗</b>
        Send
      </button>

      <button class="action" onclick="demo('Request Money')">
        <b>↓</b>
        Request
      </button>

      <button class="action" onclick="demo('Load')">
        <b>▣</b>
        Load
      </button>

      <button class="action" onclick="history()">
        <b>↺</b>
        History
      </button>

    </div>

  </section>


  <div class="body">

    <!-- SERVICES -->

    <div class="section">

      <h3>
        Services
      </h3>

      <span class="see">
        See all
      </span>

    </div>


    <div class="grid">

      <button class="service"
              onclick="demo('Bills')">

        <span>🧾</span>
        Bills

      </button>


      <button class="service"
              onclick="demo('Buy Load')">

        <span>📱</span>
        Load

      </button>


      <button class="service"
              onclick="demo('Shopping')">

        <span>🛍️</span>
        Shopping

      </button>


      <button class="service"
              onclick="demo('Food')">

        <span>🍔</span>
        Food

      </button>


      <button class="service"
              onclick="demo('Transport')">

        <span>🚗</span>
        Transport

      </button>


      <button class="service"
              onclick="demo('Subscriptions')">

        <span>🎬</span>
        Subscriptions

      </button>


      <button class="service"
              onclick="demo('Rewards')">

        <span>🎁</span>
        Rewards

      </button>


      <button class="service"
              onclick="demo('More')">

        <span>＋</span>
        More

      </button>

    </div>


    <!-- TRANSACTIONS -->

    <div class="section"
         style="margin-top:25px">

      <h3>
        Recent transactions
      </h3>

      <span class="see"
            onclick="history()">

        See all

      </span>

    </div>


    <div class="card"
         id="transactions">

      Loading...

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="nav">

    <button class="active"
            onclick="location.reload()">

      <span>⌂</span>
      Home

    </button>


    <button onclick="demo('Send Money')">

      <span>↗</span>
      Send

    </button>


    <button onclick="history()">

      <span>↺</span>
      History

    </button>


    <button onclick="location.href='index.html'">

      <span>▣</span>
      Apps

    </button>

  </div>

</div>


<!-- MODAL -->

<div class="sheet"
     id="sheet">

  <div class="modal">

    <button class="close"
            onclick="closeSheet()">

      ×

    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

function peso(n){

  return new Intl.NumberFormat(
    "en-PH",
    {
      style:"currency",
      currency:"PHP"
    }
  ).format(n);

}


function render(){

  const data = loadRP();

  document.getElementById("balance")
    .textContent =
    peso(data.gcash.balance);


  const box =
    document.getElementById(
      "transactions"
    );


  if(
    !data.gcash.transactions.length
  ){

    box.innerHTML = `
      <div class="muted"
           style="padding:10px">

        No transactions yet.

        <br>

        Your RP activity will appear here.

      </div>
    `;

    return;

  }


  box.innerHTML =
    data.gcash.transactions
    .slice(0,8)
    .map(function(t){

      const amount =
        Number(t.amount);


      return `

        <div class="tx">

          <div class="txicon">

            ${t.icon || "💳"}

          </div>


          <div class="txmain">

            <b>
              ${esc(
                t.name ||
                "Transaction"
              )}
            </b>

            <div class="muted">

              ${esc(
                t.description ||
                "RP transaction"
              )}

              <br>

              ${esc(
                t.date || ""
              )}

            </div>

          </div>


          <div class="amount ${
            amount < 0
              ? "out"
              : "in"
          }">

            ${
              amount < 0
                ? "−"
                : "+"
            }

            ${peso(
              Math.abs(amount)
            )}

          </div>

        </div>

      `;

    })
    .join("");

}


function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


function demo(name){

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <h2>
      ${name}
    </h2>

    <p style="color:#777">

      This is an RP feature.

      We'll connect this service
      to the shared GCash/MariBank
      system as we build the apps.

    </p>

  `;


  document.getElementById(
    "sheet"
  ).style.display =
    "flex";

}


function history(){

  const data = loadRP();


  let html =
    "<h2>Transaction history</h2>";


  if(
    !data.gcash.transactions.length
  ){

    html +=
      '<p class="muted">No transactions yet.</p>';

  }else{

    html +=
      data.gcash.transactions
      .map(function(t){

        const amount =
          Number(t.amount);


        return `

          <div class="tx">

            <div class="txicon">

              ${t.icon || "💳"}

            </div>


            <div class="txmain">

              <b>
                ${esc(
                  t.name ||
                  "Transaction"
                )}
              </b>

              <div class="muted">

                ${esc(
                  t.description || ""
                )}

                <br>

                ${esc(
                  t.date || ""
                )}

              </div>

            </div>


            <div class="amount ${
              amount < 0
                ? "out"
                : "in"
            }">

              ${
                amount < 0
                  ? "−"
                  : "+"
              }

              ${peso(
                Math.abs(amount)
              )}

            </div>

          </div>

        `;

      })
      .join("");

  }


  document.getElementById(
    "modalContent"
  ).innerHTML = html;


  document.getElementById(
    "sheet"
  ).style.display =
    "flex";

}


function closeSheet(){

  document.getElementById(
    "sheet"
  ).style.display =
    "none";

}


render();

</script>

</body>
</html>
