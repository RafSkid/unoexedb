<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopHub RP</title>

<script src="rp-data.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  font-family:Arial,sans-serif;
  color:#222;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#f7f7f7;
  padding-bottom:82px;
}

.header{
  background:linear-gradient(145deg,#ff641f,#ee3210);
  color:white;
  padding:18px 16px 22px;
  border-radius:0 0 28px 28px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.cart{
  border:0;
  background:#ffffff22;
  color:white;
  border-radius:14px;
  padding:10px 13px;
  font-size:18px;
}

.search{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:15px;
  outline:none;
  font-size:14px;
}

.body{
  padding:14px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:3px;
}

.cat{
  white-space:nowrap;
  border:0;
  background:white;
  padding:10px 14px;
  border-radius:20px;
}

.cat.active{
  background:#ff4b17;
  color:white;
}

.banner{
  margin-top:14px;
  background:#fff0e8;
  padding:17px;
  border-radius:18px;
}

.banner b{
  font-size:19px;
}

.banner small{
  display:block;
  color:#777;
  margin-top:5px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 2px 11px;
}

.section h3{
  margin:0;
  font-size:17px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.product{
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 2px 9px #0000000c;
}

.pic{
  height:135px;
  background:#f0f1f3;
  display:grid;
  place-items:center;
  font-size:55px;
  cursor:pointer;
}

.info{
  padding:11px;
}

.name{
  font-weight:bold;
  font-size:13px;
  min-height:34px;
  cursor:pointer;
}

.price{
  color:#ed4215;
  font-size:16px;
  font-weight:900;
  margin-top:7px;
}

.rating{
  font-size:10px;
  color:#d99400;
  margin-top:5px;
}

.sold{
  font-size:9px;
  color:#888;
  margin-top:3px;
}

.add{
  width:100%;
  border:0;
  background:#ff4b17;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  font-weight:bold;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  z-index:10;
}

.bottom button{
  flex:1;
  border:0;
  background:none;
  color:#777;
  font-size:10px;
}

.bottom span{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.modalBg{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal{
  width:min(480px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.close{
  float:right;
  border:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#eee;
  font-size:18px;
}

.cartRow{
  display:flex;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.cartMain{
  flex:1;
}

.qty{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:7px;
}

.qty button{
  border:0;
  width:29px;
  height:29px;
  border-radius:8px;
  background:#eee;
}

.primary{
  width:100%;
  border:0;
  padding:14px;
  border-radius:13px;
  background:#ff4b17;
  color:white;
  font-weight:bold;
  margin-top:11px;
}

.pay{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
  background:white;
  text-align:left;
  margin-top:8px;
}

.pay.selected{
  border:2px solid #ff4b17;
  background:#fff1ec;
}

.review{
  padding:11px 0;
  border-bottom:1px solid #eee;
  font-size:12px;
}

.empty{
  grid-column:1/-1;
  background:white;
  border-radius:18px;
  padding:30px 15px;
  text-align:center;
  color:#888;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="top">

      <div class="logo">
        🛍️ ShopHub
      </div>

      <button class="cart" onclick="openCart()">
        🛒 <span id="cartCount">0</span>
      </button>

    </div>

    <input
      id="search"
      class="search"
      placeholder="Search anything..."
      oninput="render()"
    >

  </div>


  <div class="body">

    <div class="categories">

      <button class="cat active"
        onclick="setCategory('All',this)">
        All
      </button>

      <button class="cat"
        onclick="setCategory('Electronics',this)">
        📱 Electronics
      </button>

      <button class="cat"
        onclick="setCategory('Home',this)">
        🏠 Home
      </button>

      <button class="cat"
        onclick="setCategory('Fashion',this)">
        👕 Fashion
      </button>

      <button class="cat"
        onclick="setCategory('Beauty',this)">
        💄 Beauty
      </button>

      <button class="cat"
        onclick="setCategory('Food',this)">
        🍪 Food
      </button>

    </div>


    <div class="banner">
      <b>🔥 RP Mega Sale</b>
      <small>
        Thousands of simulated products • GCash / MariBank checkout
      </small>
    </div>


    <div class="section">

      <h3>
        Products For You
      </h3>

      <span
        id="count"
        style="font-size:10px;color:#888">
      </span>

    </div>


    <div
      class="products"
      id="products">
    </div>

  </div>


  <div class="bottom">

    <button onclick="location.href='index.html'">
      <span>⌂</span>
      Home
    </button>

    <button onclick="showOrders()">
      <span>📦</span>
      Orders
    </button>

    <button onclick="openCart()">
      <span>🛒</span>
      Cart
    </button>

  </div>

</div>


<div
  class="modalBg"
  id="modalBg">

  <div class="modal">

    <button
      class="close"
      onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================================
   STATE
========================================= */

let category="All";
let cart=[];
let selectedPayment=null;


/* =========================================
   BASE PRODUCTS
========================================= */

const catalog=[

["Phone Case","Electronics",199,"📱"],
["Wireless Earbuds","Electronics",899,"🎧"],
["Bluetooth Speaker","Electronics",699,"🔊"],
["Mechanical Keyboard","Electronics",1499,"⌨️"],
["Gaming Mouse","Electronics",799,"🖱️"],
["Power Bank","Electronics",1099,"🔋"],
["Smart Watch","Electronics",1299,"⌚"],
["Phone Charger","Electronics",499,"🔌"],
["Laptop Stand","Electronics",999,"💻"],
["Webcam","Electronics",1199,"📷"],

["Cordless Vacuum","Home",2499,"🧹"],
["Robot Vacuum","Home",7999,"🤖"],
["Electric Fan","Home",1899,"🌀"],
["Air Fryer","Home",2999,"🍟"],
["Rice Cooker","Home",1599,"🍚"],
["Desk Lamp","Home",699,"💡"],
["Storage Box","Home",399,"📦"],
["Kitchen Organizer","Home",549,"🗄️"],

["Oversized T-Shirt","Fashion",399,"👕"],
["Hoodie","Fashion",899,"🧥"],
["Cargo Pants","Fashion",799,"👖"],
["Sneakers","Fashion",1599,"👟"],
["Backpack","Fashion",999,"🎒"],
["Sunglasses","Fashion",449,"🕶️"],
["Baseball Cap","Fashion",299,"🧢"],

["Facial Cleanser","Beauty",299,"🧴"],
["Moisturizer","Beauty",499,"🧴"],
["Sunscreen","Beauty",599,"☀️"],
["Lip Tint","Beauty",249,"💄"],
["Perfume","Beauty",899,"🌸"],
["Hair Dryer","Beauty",1299,"💨"],

["Chocolate Cookies","Food",149,"🍪"],
["Potato Chips","Food",99,"🥔"],
["Instant Coffee","Food",249,"☕"],
["Milk Tea","Food",299,"🧋"],
["Spicy Noodles","Food",179,"🍜"],
["Candy Pack","Food",129,"🍬"]

];


let products=[];


/* =========================================
   CREATE CATALOG VARIANTS
========================================= */

catalog.forEach((p,i)=>{

const versions=[
"",
" Premium",
" Official Store",
" Pro",
" Deluxe",
" Best Seller"
];

versions.forEach((v,n)=>{

products.push({

id:"catalog-"+i+"-"+n,

name:p[0]+v,

category:p[1],

price:p[2]+n*137,

emoji:p[3],

rating:(4.3+((i+n)%7)/10).toFixed(1),

sold:100+(i*173)+(n*431),

reviews:[
"Good quality and exactly as described.",
"Fast delivery. Recommended!",
"Very worth the price.",
"Item arrived safely.",
"Would buy again."
]

});

});

});


/* =========================================
   PESO
========================================= */

function peso(n){

return new Intl.NumberFormat(
"en-PH",
{
style:"currency",
currency:"PHP"
}
).format(Number(n)||0);

}


/* =========================================
   ESCAPE TEXT
========================================= */

function esc(s){

return String(s).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/* =========================================
   EMOJI GENERATOR
========================================= */

function getEmoji(q){

const x=q.toLowerCase();

const map=[

[["phone","iphone","android","case"],"📱"],
[["laptop","computer","pc"],"💻"],
[["keyboard"],"⌨️"],
[["mouse"],"🖱️"],
[["headphone","earbud","airpod"],"🎧"],
[["speaker"],"🔊"],
[["camera"],"📷"],
[["watch"],"⌚"],
[["charger","cable"],"🔌"],
[["battery","powerbank"],"🔋"],

[["vacuum","cleaner","clean"],"🧹"],
[["chair","seat"],"🪑"],
[["fan"],"🌀"],
[["lamp","light"],"💡"],
[["air fryer","fryer"],"🍟"],
[["rice"],"🍚"],

[["shirt","tshirt"],"👕"],
[["hoodie","jacket"],"🧥"],
[["pants"],"👖"],
[["shoe","sneaker"],"👟"],
[["bag","backpack"],"🎒"],
[["cap","hat"],"🧢"],

[["makeup","lip"],"💄"],
[["perfume"],"🌸"],
[["cream","lotion"],"🧴"],
[["hair"],"💨"],

[["food","cookie","snack"],"🍪"],
[["coffee"],"☕"],
[["tea","milk tea"],"🧋"],
[["noodle","ramen"],"🍜"],
[["candy"],"🍬"],
[["pizza"],"🍕"],
[["burger"],"🍔"]

];

for(const entry of map){

for(const word of entry[0]){

if(x.includes(word)){
return entry[1];
}

}

}

return "🛍️";

}


/* =========================================
   GENERATE ANYTHING
========================================= */

function generate(q){

const clean=q.trim() || "Mystery Product";

const title=clean
.split(/\s+/)
.map(word=>
word.charAt(0).toUpperCase()+word.slice(1)
)
.join(" ");

const emoji=getEmoji(clean);

const suffixes=[

"Premium",
"Official Store",
"Pro",
"Deluxe",
"2026 Edition",
"Best Seller",
"High Quality",
"Value Pack",
"Trending",
"Classic",
"Plus",
"Max",
"Ultra",
"Standard",
"Special",
"Limited Edition",
"Popular",
"New",
"Original",
"Advanced",
"Essential",
"Smart",
"Exclusive",
"Premium Edition",
"Super",
"Elite",
"V2",
"V3",
"Performance",
"Signature"

];

const descriptions=[

"Popular RP marketplace item.",
"Highly rated RP seller listing.",
"New arrival in the RP marketplace.",
"Trending item with many RP buyers.",
"Premium quality simulated listing.",
"Popular choice among RP shoppers.",
"Limited RP marketplace edition.",
"Best-selling simulated product.",
"Value-for-money RP listing.",
"Recommended by RP buyers."

];


return Array.from(
{length:30},
(_,i)=>{

let hash=0;

for(const c of clean){

hash=((hash<<5)-hash)+c.charCodeAt(0);
hash|=0;

}

const base=Math.abs(hash)%1800;

const price=
99+((base+i*173)%9900);

const rating=
(4.1+((i*7)%9)/10).toFixed(1);

const sold=
127+((base+i*431)%48000);

return{

id:
"generated-"+
encodeURIComponent(clean)+
"-"+
i,

name:
title+" "+suffixes[i],

category:"Search",

price:price,

emoji:emoji,

rating:rating,

sold:sold,

reviews:[

descriptions[i%descriptions.length],

"Item arrived safely and looks great.",

"Good value for the price.",

"Fast RP shipping. Recommended!",

"Would definitely buy again."

]

};

});

}


/* =========================================
   RENDER
========================================= */

function render(){

const input=
document.getElementById("search");

const q=input
?input.value.toLowerCase().trim()
:"";

let result=[];


/* NO SEARCH */

if(!q){

result=products.filter(p=>

category==="All" ||
p.category===category

);

}


/* SEARCH */

else{

const matches=
products.filter(p=>{

const text=
(p.name+" "+p.category)
.toLowerCase();

return text.includes(q);

});

const generated=generate(q);

result=[
...matches,
...generated
];

}


document.getElementById("count")
.textContent=
result.length+" items";


const box=
document.getElementById("products");


box.innerHTML=
result.map(productCard).join("");

}


/* =========================================
   PRODUCT CARD
========================================= */

function productCard(p){

const data=
encodeURIComponent(
JSON.stringify(p)
);

return `

<div class="product">

<div
class="pic"
onclick="viewProductEncoded('${data}')">

${p.emoji}

</div>

<div class="info">

<div
class="name"
onclick="viewProductEncoded('${data}')">

${esc(p.name)}

</div>

<div class="price">
${peso(p.price)}
</div>

<div class="rating">
⭐ ${p.rating}
</div>

<div class="sold">
${Number(p.sold).toLocaleString()} sold
</div>

<button
class="add"
onclick="addEncoded('${data}')">

Add to Cart

</button>

</div>

</div>

`;

}


/* =========================================
   ENCODED PRODUCT FUNCTIONS
========================================= */

function decodeProduct(data){

return JSON.parse(
decodeURIComponent(data)
);

}


function addEncoded(data){

addToCart(
decodeProduct(data)
);

}


function viewProductEncoded(data){

viewProduct(
decodeProduct(data)
);

}


/* =========================================
   PRODUCT DETAILS
========================================= */

function viewProduct(p){

openModal(`

<h2>
${p.emoji} ${esc(p.name)}
</h2>

<div style="
font-size:25px;
font-weight:900;
color:#ed4215">

${peso(p.price)}

</div>

<p>
⭐ ${p.rating}
&nbsp; • &nbsp;
${Number(p.sold).toLocaleString()} sold
</p>

<div style="
background:#fff4ed;
padding:14px;
border-radius:14px;
font-size:12px">

🚚 Free RP shipping

<br><br>

🛡️ RP Buyer Protection

<br><br>

📦 Estimated delivery: 2–5 days

<br><br>

💳 GCash / MariBank available

</div>

<h3>
Customer Reviews
</h3>

${p.reviews.map((r,i)=>`

<div class="review">

⭐ ${(4+(i%2)*.5).toFixed(1)}

<br><br>

"${esc(r)}"

<br><br>

<span style="
color:#999;
font-size:10px">

Verified RP buyer

</span>

</div>

`).join("")}

<button
class="primary"
onclick="addEncodedAndClose('${encodeURIComponent(JSON.stringify(p))}')">

🛒 Add to Cart

</button>

`);

}


function addEncodedAndClose(data){

addEncoded(data);

closeModal();

}


/* =========================================
   CART
========================================= */

function addToCart(p){

const found=
cart.find(x=>x.id===p.id);

if(found){

found.qty++;

}else{

cart.push({
...p,
qty:1
});

}

updateCart();

}


function updateCart(){

document.getElementById("cartCount")
.textContent=
cart.reduce(
(a,x)=>a+x.qty,
0
);

}


function subtotal(){

return cart.reduce(
(a,x)=>
a+(Number(x.price)*x.qty),
0
);

}


/* =========================================
   CART MODAL
========================================= */

function openCart(){

if(!cart.length){

openModal(`

<h2>🛒 Your Cart</h2>

<p style="color:#888">
Your cart is empty.
</p>

`);

return;

}


let html=
"<h2>🛒 Your Cart</h2>";


html+=cart.map((p,i)=>`

<div class="cartRow">

<div style="font-size:30px">
${p.emoji}
</div>

<div class="cartMain">

<b>
${esc(p.name)}
</b>

<div style="margin-top:5px">
${peso(p.price)}
</div>

<div class="qty">

<button onclick="changeQty(${i},-1)">
−
</button>

<b>
${p.qty}
</b>

<button onclick="changeQty(${i},1)">
+
</button>

</div>

</div>

<b>
${peso(p.price*p.qty)}
</b>

</div>

`).join("");


const sub=subtotal();

const shipping=
sub>=1000?0:49;

const total=
sub+shipping;


html+=`

<hr>

<div style="
display:flex;
justify-content:space-between">

<span>
Subtotal
</span>

<b>
${peso(sub)}
</b>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-top:8px">

<span>
Shipping
</span>

<b>
${shipping?peso(shipping):"FREE"}
</b>

</div>

<div style="
display:flex;
justify-content:space-between;
font-size:19px;
margin-top:14px">

<b>
Total
</b>

<b>
${peso(total)}
</b>

</div>

<button
class="primary"
onclick="checkout()">

Checkout

</button>

`;

openModal(html);

}


function changeQty(index,amount){

if(!cart[index])return;

cart[index].qty+=amount;

if(cart[index].qty<=0){

cart.splice(index,1);

}

updateCart();

openCart();

}


/* =========================================
   CHECKOUT
========================================= */

function checkout(){

if(!cart.length){

openCart();
return;

}

const sub=subtotal();

const shipping=
sub>=1000?0:49;

const total=
sub+shipping;

selectedPayment=null;


openModal(`

<h2>
Checkout
</h2>

<div style="
background:#f6f7f8;
padding:14px;
border-radius:14px">

Subtotal:
${peso(sub)}

<br><br>

Shipping:
${shipping?peso(shipping):"FREE"}

<hr>

<b>
Total:
${peso(total)}
</b>

</div>

<h3>
Payment Method
</h3>

<button
class="pay"
onclick="selectPay('gcash',this)">

💙 GCash

</button>

<button
class="pay"
onclick="selectPay('maribank',this)">

🧡 MariBank

</button>

<button
class="primary"
onclick="placeOrder()">

🛍️ Place Order

</button>

`);

}


function selectPay(type,el){

selectedPayment=type;

document
.querySelectorAll(".pay")
.forEach(x=>
x.classList.remove("selected")
);

el.classList.add("selected");

}


/* =========================================
   PLACE ORDER
========================================= */

function placeOrder(){

if(!selectedPayment){

alert(
"Please choose GCash or MariBank."
);

return;

}

if(!cart.length){

alert("Your cart is empty.");

return;

}


const sub=subtotal();

const shipping=
sub>=1000?0:49;

const total=
sub+shipping;


/* CHECK SHARED RP WALLET */

if(typeof payRP!=="function"){

alert(
"rp-data.js is not loading. Make sure rp-data.js is in the same folder."
);

return;

}


const result=
payRP(
selectedPayment,
total,
{
name:"ShopHub Purchase",

description:
cart.map(x=>
x.qty+"× "+x.name
).join(", "),

icon:"🛍️"

}
);


if(!result.success){

alert(result.message);

return;

}


/* CREATE ORDER */

const order={

id:"SHOP"+Date.now(),

items:
cart.map(x=>({

name:x.name,

qty:x.qty,

price:x.price

})),

subtotal:sub,

shipping:shipping,

total:total,

payment:selectedPayment,

status:"To Ship",

date:
new Date()
.toLocaleString("en-PH")

};


/* SAVE TO SHARED MEMORY */

if(typeof addShopeeOrder==="function"){

addShopeeOrder(order);

}else{

const data=loadRP();

if(!data.shopeeOrders){

data.shopeeOrders=[];

}

data.shopeeOrders.unshift(order);

saveRP(data);

}


/* CLEAR CART */

cart=[];

updateCart();


/* SUCCESS */

const paidVia=
selectedPayment==="gcash"
?"GCash"
:"MariBank";


openModal(`

<h2>
🎉 Order Placed!
</h2>

<p>
Your ShopHub order is confirmed.
</p>

<div style="
background:#f6f7f8;
padding:14px;
border-radius:14px">

Order:
<b>
${order.id}
</b>

<br><br>

Paid:
<b>
${peso(total)}
</b>

<br>
