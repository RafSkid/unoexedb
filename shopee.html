<script>

let category="All";
let cart=[];
let selectedPayment=null;


/* =========================================
   BASE CATALOG
========================================= */

const catalog=[

["Phone Case","Electronics",199,"📱"],
["Wireless Earbuds","Electronics",899,"🎧"],
["Bluetooth Speaker","Electronics",699,"🔊"],
["Mechanical Keyboard","Electronics",1499,"⌨️"],
["Gaming Mouse","Electronics",799,"🖱️"],

["Cordless Vacuum","Home",2499,"🧹"],
["Robot Vacuum","Home",7999,"🤖"],
["Electric Fan","Home",1899,"🌀"],

["Sneakers","Fashion",1599,"👟"],

["Potato Chips","Food",99,"🥔"],
["Instant Coffee","Food",249,"☕"],
["Milk Tea","Food",299,"🧋"],
["Spicy Noodles","Food",179,"🍜"],
["Candy Pack","Food",129,"🍬"]

];


/* =========================================
   CREATE BASE PRODUCTS
========================================= */

let products=[];

catalog.forEach((p,i)=>{

const versions=[
"",
" Premium",
" Official Store",
" Pro",
" Deluxe",
" Best Seller"
];

versions.forEach((v,n)=>{

products.push({

id:"catalog-"+i+"-"+n,

name:p[0]+v,

category:p[1],

price:p[2]+n*137,

emoji:p[3],

rating:(4.3+((i+n)%7)/10).toFixed(1),

sold:100+(i*173)+(n*431),

reviews:[
"Good quality and exactly as described.",
"Fast delivery. Recommended!",
"Very worth the price.",
"Item arrived safely.",
"Would buy again."
]

});

});

});


/* =========================================
   HELPERS
========================================= */

function peso(n){

return new Intl.NumberFormat(
"en-PH",
{
style:"currency",
currency:"PHP"
}
).format(Number(n)||0);

}


function esc(s){

return String(s).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


/* =========================================
   EMOJI DETECTOR
   Works even with nonsense.
========================================= */

function getEmoji(q){

const x=q.toLowerCase();

const map=[

[["phone","iphone","android","case"],"📱"],
[["laptop","computer","pc"],"💻"],
[["keyboard"],"⌨️"],
[["mouse"],"🖱️"],
[["headphone","earbud","airpod"],"🎧"],
[["speaker"],"🔊"],
[["camera"],"📷"],
[["watch"],"⌚"],
[["charger","cable"],"🔌"],
[["battery","powerbank"],"🔋"],

[["vacuum","cleaner","clean"],"🧹"],
[["chair","seat"],"🪑"],
[["fan"],"🌀"],
[["lamp","light"],"💡"],
[["air fryer","fryer"],"🍟"],
[["rice"],"🍚"],

[["shirt","tshirt"],"👕"],
[["hoodie","jacket"],"🧥"],
[["pants"],"👖"],
[["shoe","sneaker"],"👟"],
[["bag","backpack"],"🎒"],
[["cap","hat"],"🧢"],

[["makeup","lip"],"💄"],
[["perfume"],"🌸"],
[["cream","lotion"],"🧴"],
[["hair"],"💨"],

[["food","cookie","snack"],"🍪"],
[["coffee"],"☕"],
[["tea","milk tea"],"🧋"],
[["noodle","ramen"],"🍜"],
[["candy"],"🍬"],
[["pizza"],"🍕"],
[["burger"],"🍔"]

];

for(const entry of map){

for(const word of entry[0]){

if(x.includes(word)){
return entry[1];
}

}

}

return "🛍️";

}


/* =========================================
   GENERATE ANY SEARCH
========================================= */

function generate(q){

/*
IMPORTANT:

No validation.

No "does product exist?"

No exact-match requirement.

ANY text becomes a product.
*/

const clean=q.trim() || "Mystery";


/*
Make the search look like a product name.
*/

const title=clean
.split(/\s+/)
.map(word=>
word.charAt(0).toUpperCase()+
word.slice(1)
)
.join(" ");


const emoji=getEmoji(clean);


/*
Different product suffixes.
*/

const suffixes=[

"Premium",
"Official Store",
"Pro",
"Deluxe",
"2026 Edition",
"Best Seller",
"High Quality",
"Value Pack",
"Trending",
"Classic",
"Plus",
"Max",
"Ultra",
"Standard",
"Special",
"Limited Edition",
"Popular",
"New",
"Original",
"Advanced",
"Essential",
"Smart",
"Exclusive",
"Premium Edition",
"Super",
"Elite",
"V2",
"V3",
"Performance",
"Signature"

];


/*
Different descriptions.
*/

const descriptions=[

"Popular RP marketplace item.",
"Highly rated RP seller listing.",
"New arrival in the RP marketplace.",
"Trending item with many RP buyers.",
"Premium quality simulated listing.",
"Popular choice among RP shoppers.",
"Limited RP marketplace edition.",
"Best-selling simulated product.",
"Value-for-money RP listing.",
"Recommended by RP buyers."

];


/*
Generate 30 PRODUCTS.

Even nonsense gets products.
*/

return Array.from(
{length:30},
(_,i)=>{

/*
Deterministic-ish price based
on the search text and index.
*/

let hash=0;

for(let c of clean){

hash=
((hash<<5)-hash)+
c.charCodeAt(0);

hash|=0;

}

const base=
Math.abs(hash)%1800;

const price=
99+
((base+i*173)%9900);


/*
Different ratings.
*/

const rating=
(4.1+((i*7)%9)/10)
.toFixed(1);


/*
Different sold numbers.
*/

const sold=
127+
((base+i*431)%48000);


return{

id:
"generated-"+
encodeURIComponent(clean)+
"-"+
i,

name:
title+
" "+
suffixes[i],

category:
"Search",

price:price,

emoji:emoji,

rating:rating,

sold:sold,

reviews:[

descriptions[i%descriptions.length],

"Item arrived safely and looks great.",

"Good value for the price.",

"Fast RP shipping. Recommended!",

"Would definitely buy again."

]

};

});

}


/* =========================================
   RENDER
========================================= */

function render(){

const q=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


let result=[];


/*
=========================================
NO SEARCH
=========================================
*/

if(!q){

result=
products.filter(p=>

category==="All" ||
p.category===category

);

}


/*
=========================================
ANY SEARCH
=========================================
*/

else{

/*
First show matching real catalog items.
*/

const matches=
products.filter(p=>{

const text=
(
p.name+
" "+
p.category
).toLowerCase();

return text.includes(q);

});


/*
Then ALWAYS generate 30 products.

This is the important part.
*/

const generated=
generate(q);


/*
Matching catalog first,
generated results after.
*/

result=[
...matches,
...generated
];


/*
If user typed nonsense,
generated still exists.
*/

}


/*
=========================================
COUNT
=========================================
*/

document.getElementById(
"count"
).textContent=
result.length+
" items";


/*
=========================================
DISPLAY
=========================================
*/

document.getElementById(
"products"
).innerHTML=
result
.map(productCard)
.join("");

}


/* =========================================
   PRODUCT CARD
========================================= */

function productCard(p){

return `

<div class="product">

<div
class="pic"
onclick='viewProduct(${JSON.stringify(p)})'>

${p.emoji}

</div>

<div class="info">

<div
class="name"
onclick='viewProduct(${JSON.stringify(p)})'>

${esc(p.name)}

</div>

<div class="price">

${peso(p.price)}

</div>

<div class="rating">

⭐ ${p.rating}

</div>

<div class="sold">

${Number(p.sold).toLocaleString()} sold

</div>

<button
class="add"
onclick='addToCart(${JSON.stringify(p)})'>

Add to Cart

</button>

</div>

</div>

`;

}


/* =========================================
   PRODUCT DETAILS
========================================= */

function viewProduct(p){

openModal(`

<h2>

${p.emoji}
${esc(p.name)}

</h2>

<div style="
font-size:25px;
font-weight:900;
color:#ed4215">

${peso(p.price)}

📦 Estimated delivery: 2–5 days

<br>

💳 GCash / MariBank available at checkout

</div>


<h3>
Customer Reviews
</h3>

${p.reviews.map(
(r,i)=>`

<div class="review">

⭐ ${
(4+(i%2)*.5).toFixed(1)
}

<br>

"${esc(r)}"

<br>

<span style="
color:#999;
font-size:10px">

Verified RP buyer

</span>

</div>

`
).join("")}


<button
class="primary"
onclick='addToCart(${JSON.stringify(p)});closeModal()'>

🛒 Add to Cart

</button>

`);

}


/* =========================================
   CART
========================================= */

function addToCart(p){

const found=
cart.find(x=>x.id===p.id);


if(found){

found.qty++;

}else{

cart.push({

...p,

qty:1

});

}

updateCart();

}


function updateCart(){

document.getElementById(
"cartCount"
).textContent=
cart.reduce(
(a,x)=>a+x.qty,
0
);

}


function subtotal(){

return cart.reduce(
(a,x)=>
a+(x.price*x.qty),
0
);

}


/* =========================================
   CART PAGE
========================================= */

function openCart(){

if(!cart.length){

openModal(`

<h2>🛒 Cart</h2>

<p style="color:#888">

Your cart is empty.

</p>

`);

return;

}


let html=
"<h2>🛒 Cart</h2>";


html+=
cart.map(
(p,i)=>`

<div class="cartRow">

<div style="font-size:30px">

${p.emoji}

</div>

<div class="cartMain">

<b>
${esc(p.name)}
</b>

<div>
${peso(p.price)}
</div>

<div class="qty">

<button
onclick="qty(${i},-1)">

−

</button>

<b>
${p.qty}
</b>

<button
onclick="qty(${i},1)">

+

</button>

</div>

</div>

<b>

${peso(
p.price*p.qty
)}

</b>

</div>

`
).join("");


const sub=
subtotal();

const shipping=
sub>=1000
?0
:49;

const total=
sub+shipping;


html+=`

<hr>

<div style="
display:flex;
justify-content:space-between">

<span>
Subtotal
</span>

<b>
${peso(sub)}
</b>

</div>


<div style="
display:flex;
justify-content:space-between;
margin-top:7px">

<span>
Shipping
</span>

<b>

${
shipping
?peso(shipping)
:"FREE"
}

</b>

</div>


<div style="
display:flex;
justify-content:space-between;
font-size:19px;
margin-top:12px">

<b>
Total
</b>

<b>
${peso(total)}
</b>

</div>


<button
class="primary"
onclick="checkout()">

Checkout

</button>

`;


openModal(html);

}


function qty(i,n){

cart[i].qty+=n;


if(cart[i].qty<=0){

cart.splice(i,1);

}


updateCart();

openCart();

}


/* =========================================
   CHECKOUT
========================================= */

function checkout(){

const sub=
subtotal();

const shipping=
sub>=1000
?0
:49;

const total=
sub+shipping;


selectedPayment=null;


openModal(`

<h2>
Checkout
</h2>


<div style="
background:#f6f7f8;
padding:14px;
border-radius:14px">

Subtotal:
${peso(sub)}

<br>

Shipping:
${
shipping
?peso(shipping)
:"FREE"
}

<hr>

<b>
Total:
${peso(total)}
</b>

</div>


<h3>
Payment
</h3>


<button
class="pay"
onclick="selectPay('gcash',this)">

💙 GCash

</button>


<button
class="pay"
onclick="selectPay('maribank',this)">

🧡 MariBank

</button>


<button
class="primary"
onclick="placeOrder()">

🛍️ Place Order

</button>

`);

}


function selectPay(
type,
el
){

selectedPayment=
type;


document
.querySelectorAll(".pay")
.forEach(
x=>
x.classList.remove("selected")
);


el.classList.add("selected");

}


/* =========================================
   PAYMENT
========================================= */

function placeOrder(){

if(!selectedPayment){

alert(
"Please choose GCash or MariBank."
);

return;

}


const sub=
subtotal();

const shipping=
sub>=1000
?0
:49;

const total=
sub+shipping;


/*
REAL RP WALLET TRANSACTION
*/

const result=
payRP(
selectedPayment,
total,
{

name:
"ShopHub Purchase",

description:
cart.map(
x=>
x.qty+
"× "+
x.name
).join(", "),

icon:"🛍️"

});


if(!result.success){

alert(
result.message
);

return;

}


/*
SAVE ORDER
*/

const order={

id:
"SHOP"+
Date.now(),

items:
cart.map(
x=>({

name:x.name,

qty:x.qty,

price:x.price

})

),

subtotal:sub,

shipping:shipping,

total:total,

payment:
selectedPayment,

status:
"To Ship",

date:
new Date()
.toLocaleString("en-PH")

};


/*
Use shared RP memory.
*/

addShopeeOrder(order);


/*
EMPTY CART
*/

cart=[];

updateCart();


/*
SUCCESS
*/

openModal(`

<h2>
🎉 Order Placed!
</h2>


<p>

Your ShopHub order is confirmed.

</p>


<div style="
background:#f6f7f8;
padding:14px;
border-radius:14px">

Order:
<b>
${order.id}
</b>

<br><br>

Paid:
<b>
${peso(total)}
</b>

<br>

Payment:
<b>

${
selectedPayment==="gcash"
?"GCash"
:"MariBank"
}

</b>

<br><br>

Status:
<b style="color:#ed4215">

To Ship

</b>

</div>


<button
class="primary"
onclick="closeModal()">

Done

</button>

`);

}


/* =========================================
   ORDERS
========================================= */

function showOrders(){

const data=
loadRP();

const orders=
data.shopeeOrders||[];


let html=
"<h2>📦 ShopHub Orders</h2>";


if(!orders.length){

html+=`

<p style="color:#888">

No ShopHub orders yet.

</p>

`;

}else{

html+=
orders.map(
o=>`

<div style="
padding:14px 0;
border-bottom:1px solid #eee">

<b>
${esc(o.id)}
</b>

<div style="
font-size:11px;
color:#777;
margin-top:5px">

${o.items.map(
x=>
x.qty+
"× "+
esc(x.name)
).join(", ")}

</div>

<div style="
margin-top:7px">

<strong>

${peso(o.total)}

</strong>

</div>

<div style="
font-size:10px;
color:#ed4215;
margin-top:5px">

${esc(o.status)}

</div>

<div style="
font-size:10px;
color:#999">

Paid via ${
o.payment==="gcash"
?"GCash"
:"MariBank"
}

<br>

${esc(o.date)}

</div>

</div>

`
).join("");

}


openModal(html);

}


/* =========================================
   CATEGORY
========================================= */

function setCat(el){

document
.querySelectorAll(".cat")
.forEach(
x=>
x.classList.remove("active")
);

el.classList.add("active");

render();

}


/* =========================================
   MODAL
========================================= */

function openModal(html){

document.getElementById(
"modalContent"
).innerHTML=html;

document.getElementById(
"modalBg"
).style.display="flex";

}


function closeModal(){

document.getElementById(
"modalBg"
).style.display="none";

}


/* =========================================
   START
========================================= */

render();

  </script>
